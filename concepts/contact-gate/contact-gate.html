    root.appendChild(el('p', 'kcg-help', both ? 'Both emails unlocked. Nice playing.' : 'Emails are locked. Beat a tiny game to reveal one.'));
    var row = el('div', 'kcg-row');
    KINDS.forEach(function (kind) {
      var item = el('div', 'kcg-item'); item.setAttribute('data-kcg', kind);
      if (isOpen(kind)) {
        var email = unseal(kind), card = el('div', 'kcg-card');
        card.appendChild(el('span', 'kcg-lab', LABEL[kind]));
        var mail = el('span', 'kcg-mail', email);
        var cp = mkBtn('kcg-sm', 'Copy');
        cp.setAttribute('aria-label', 'Copy ' + LABEL[kind] + ' email');
        cp.addEventListener('click', function () { copyEmail(cp, email, mail); });
        var a = el('a', 'kcg-link', 'Email'); a.href = 'mailto:' + email;
        var rp = mkBtn('kcg-ghost kcg-sm', 'Replay');
        rp.setAttribute('aria-label', 'Replay the ' + LABEL[kind] + ' game');
        rp.addEventListener('click', function () { openModal(kind, rp); });
        card.appendChild(mail); card.appendChild(cp); card.appendChild(a); card.appendChild(rp);
        item.appendChild(card);
      } else {
        var b = mkBtn('kcg-playbtn', null);
        b.appendChild(el('span', 'kcg-lock'));
        b.appendChild(el('span', null, LABEL[kind] + ' — play to unlock'));
        b.addEventListener('click', function () { openModal(kind, b); });
        item.appendChild(b);
      }
      row.appendChild(item);
    });
    root.appendChild(row);
  }
  function renderAll() {
    mounts = mounts.filter(function (r) { return r.isConnected; });
    mounts.forEach(renderGate);
  }
  function mount(host) {
    if (!host || host.nodeType !== 1) return;
    ensureFont();
    if (host.__kcgRoot && host.__kcgRoot.parentNode === host) { renderGate(host.__kcgRoot); return; }
    var root = el('div', 'kcg-root kcg-gate');
    host.appendChild(root); host.__kcgRoot = root; mounts.push(root);
    renderGate(root);
  }
  function scan() { var list = D.querySelectorAll('[data-contact-gate]'); for (var i = 0; i < list.length; i++) if (!list[i].__kcgRoot) mount(list[i]); }
  var queued = false;
  function queueScan() { if (queued) return; queued = true; setTimeout(function () { queued = false; scan(); }, 0); }
  function init() {
    scan();
    if (W.MutationObserver) {
      new MutationObserver(function (muts) {
        if (queued) return;
        for (var i = 0; i < muts.length; i++) {
          var add = muts[i].addedNodes;
          for (var j = 0; j < add.length; j++) {
            var n = add[j];
            if (n.nodeType !== 1 || (n.classList && n.classList.contains('kcg-root'))) continue;
            if ((n.hasAttribute && n.hasAttribute('data-contact-gate')) || (n.firstElementChild && n.querySelector('[data-contact-gate]'))) { queueScan(); return; }
          }
        }
      }).observe(D.documentElement, { childList: true, subtree: true });
    }
  }
  if (D.readyState === 'loading') D.addEventListener('DOMContentLoaded', init); else init();

  W.KaiavContact = Object.freeze({
    open: function (kind) { openModal(kind, D.activeElement); },
    mount: function (elm) { mount(elm); }
  });

  /* optional test hook: only populated when a test harness predefines window.__kcgTest */
  var TH = W.__kcgTest;
  if (TH && typeof TH === 'object') {
    TH.cur = function () { return cur; };
    TH.input = input;
    TH.stop = stopLoop;
    TH.tick = function (n) { for (var i = 0; i < n && cur; i++) cur.game.update(STEP, input); if (cur) cur.game.render(M.ctx); };
  }
})();
</script>
