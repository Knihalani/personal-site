<style>
:root{
  color-scheme:dark;
  --bg:#03040a;
  --panel:rgba(8,9,16,.72);
  --panel-solid:#0a0b13;
  --ink:#ece6da;
  --ink-dim:#a39d92;
  --ink-faint:#5d5a55;
  --gold:#f2b45a;
  --gold-hot:#ffd79a;
  --teal:#6fd8c6;
  --rule:rgba(236,230,218,.14);
  --serif:"Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono:"DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
::selection{background:var(--gold);color:#000}
button{font:inherit;color:inherit}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.hover{cursor:pointer}
#gl.drag{cursor:grabbing}
.nogl{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%, #ffcf7a 0, #f29a3a 3%, #4a1c08 9%, #120a10 30%, var(--bg) 70%)}

.ui{position:fixed;inset:0;pointer-events:none;
  padding-top:max(18px, env(safe-area-inset-top,0px));padding-bottom:max(16px, env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.ui > *{pointer-events:auto}

.brand{position:absolute;top:max(18px, env(safe-area-inset-top,0px));left:max(20px, env(safe-area-inset-left,0px));max-width:420px}
.brand .k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.brand h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5vw,68px);line-height:.92;margin:6px 0 8px;letter-spacing:-.01em}
.brand h1 i{color:var(--gold-hot)}
.brand p{margin:0;color:var(--ink-dim);font-size:13px}

.index{position:absolute;left:max(20px, env(safe-area-inset-left,0px));top:50%;transform:translateY(-40%);list-style:none;margin:0;padding:0}
.index li{margin:2px 0}
.index button{background:none;border:0;padding:6px 0;cursor:pointer;display:flex;gap:12px;align-items:baseline;color:var(--ink-dim);font-size:13px;transition:color .2s}
.index button .n{color:var(--ink-faint);font-size:11px;width:22px}
.index button .dot{width:8px;height:8px;border-radius:50%;display:inline-block;transform:translateY(-1px)}
.index button:hover,.index button[aria-current="true"]{color:var(--ink)}
.index button[aria-current="true"] .nm{border-bottom:1px solid var(--gold)}
.index .h{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}

.foot{position:absolute;left:max(20px, env(safe-area-inset-left,0px));right:max(20px, env(safe-area-inset-right,0px));bottom:max(16px, env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none}
.foot > *{pointer-events:auto}
.time{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--rule);padding:10px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12px}
.time label{color:var(--ink-dim);letter-spacing:.12em;text-transform:uppercase;font-size:10px}
.time output{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold-hot)}
.time input[type=range]{-webkit-appearance:none;appearance:none;width:170px;height:20px;background:transparent;cursor:pointer}
.time input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--gold) var(--p,25%),var(--rule) var(--p,25%))}
.time input[type=range]::-moz-range-track{height:2px;background:var(--rule)}
.time input[type=range]::-moz-range-progress{height:2px;background:var(--gold)}
.time input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold-hot);margin-top:-6px;box-shadow:0 0 12px var(--gold)}
.time input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold-hot);border:0}
.time button{background:none;border:1px solid var(--rule);padding:3px 8px;cursor:pointer;font-size:11px}
.hint{color:var(--ink-faint);font-size:11px;text-align:right;line-height:1.6}
.contact-mini{font-size:12px;color:var(--ink-dim);text-align:right}
.contact-mini a{text-decoration:none;border-bottom:1px solid var(--rule);margin-left:12px}
.contact-mini a:hover{color:var(--ink);border-color:var(--gold)}

.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:4px 6px;cursor:pointer;white-space:nowrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.85;will-change:transform;transition:opacity .35s, color .2s;text-shadow:0 0 8px #000, 0 0 2px #000}
.lbl::before{content:"";display:inline-block;width:14px;height:1px;background:currentColor;vertical-align:middle;margin-right:6px;opacity:.6}
.lbl:hover,.lbl.on{color:var(--gold-hot);opacity:1}
.labels.hide .lbl{opacity:0;pointer-events:none}

.panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:linear-gradient(90deg, rgba(3,4,10,0) 0%, rgba(3,4,10,.86) 18%, rgba(3,4,10,.94) 100%);
  padding:max(28px, env(safe-area-inset-top,0px)) max(28px, env(safe-area-inset-right,0px)) 28px 64px;display:flex;flex-direction:column;justify-content:center;
  transform:translateX(105%);transition:transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:auto}
.panel.open{transform:none}
.panel .back{align-self:flex-start;background:none;border:1px solid var(--rule);padding:8px 12px;cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:34px}
.panel .back:hover{border-color:var(--gold);color:var(--gold-hot)}
.panel .kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.panel h2{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5vw,64px);line-height:.95;margin:10px 0 16px}
.panel h2 i{color:var(--gold-hot)}
.panel .lede{font-family:var(--serif);font-size:24px;line-height:1.25;margin:0 0 14px;color:var(--ink)}
.panel .body{color:var(--ink-dim);font-size:13px;line-height:1.7;margin:0 0 20px}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 24px;font-size:12px;border-top:1px solid var(--rule);padding-top:14px}
.panel dt{color:var(--ink-faint);text-transform:uppercase;letter-spacing:.12em;font-size:10px;padding-top:2px}
.panel dd{margin:0;color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:var(--gold);color:#140c02;text-decoration:none;padding:12px 16px;font-size:13px;border:0;cursor:pointer}
.cta:hover{background:var(--gold-hot)}
.cta + .cta{margin-top:10px}
.email{user-select:all;font-size:15px;border:1px solid var(--rule);padding:10px 12px;margin-bottom:12px;align-self:flex-start;overflow-wrap:anywhere}
.ctas{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

@media (max-width:760px){
  .brand h1{font-size:40px}
  .brand p{font-size:12px}
  .index{top:auto;bottom:calc(max(16px, env(safe-area-inset-bottom,0px)) + 64px);left:0;right:0;transform:none;display:flex;gap:6px;overflow-x:auto;padding:0 max(16px, env(safe-area-inset-left,0px));scrollbar-width:none}
  .index::-webkit-scrollbar{display:none}
  .index .h{display:none}
  .index li{flex:none;margin:0}
  .index button{background:var(--panel);border:1px solid var(--rule);padding:8px 10px;gap:8px}
  .index button .n{display:none}
  .foot{left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px))}
  .time{width:100%;justify-content:space-between;padding:8px 12px}
  .time input[type=range]{flex:1;width:auto;min-width:0}
  .foot .right{display:none}
  .panel{top:auto;width:100%;height:auto;max-height:62vh;max-height:62dvh;overflow-y:auto;justify-content:flex-start;
    background:linear-gradient(180deg, rgba(3,4,10,0) 0%, rgba(3,4,10,.92) 14%, rgba(3,4,10,.97) 100%);
    padding:40px max(16px, env(safe-area-inset-right,0px)) max(20px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));transform:translateY(105%)}
  .panel .back{margin-bottom:16px}
  .panel h2{font-size:44px;margin:6px 0 10px}
  .panel .lede{font-size:20px}
  .lbl{font-size:10px}
}
@media (prefers-reduced-motion:reduce){ .panel{transition:none} }
</style>

' vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));',

' vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);',
' vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);',
' vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);',
' vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));',
' vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',
' vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);',
' vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
' p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;',
' vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;',
' return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
'}',
'float fbm(vec3 p, int oct){ float a=0.5, s=0.0; for(int i=0;i<7;i++){ if(i>=oct) break; s+=a*snoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }',

'#elif TYPE == 2',
' float c1 = abs(snoise(q*3.5)); float c2 = abs(snoise(q*9.0+3.0));',
' float crack = (1.0 - smoothstep(0.0, 0.05, c1)) + (1.0 - smoothstep(0.0,0.035,c2))*0.6;',

' alb = mix(alb, vec3(0.97), clouds*0.9); specK *= 1.0 - clouds;',
'#else',
' float c = cells(q*4.0); float c2 = cells(q*9.0+7.0);',
' float rim = smoothstep(0.32,0.4,c)*(1.0-smoothstep(0.4,0.55,c));',

var atmoMat = function(color, k, scale){

function buildStars(n){
  var pos = new Float32Array(n * 3), col = new Float32Array(n * 3), sz = new Float32Array(n);
  for (var i = 0; i < n; i++){
    var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    // concentrate some stars toward a galactic band
    if (i % 3 === 0){ u = (Math.random() - 0.5) * 0.35; s = Math.sqrt(1 - u * u); }
    pos[i*3] = s * Math.cos(th) * 600; pos[i*3+1] = u * 600; pos[i*3+2] = s * Math.sin(th) * 600;
    var tt = Math.random();
    col[i*3] = tt < 0.3 ? 0.75 : 1.0; col[i*3+1] = tt < 0.3 ? 0.85 : (tt > 0.85 ? 0.75 : 0.95); col[i*3+2] = tt < 0.3 ? 1.0 : (tt > 0.85 ? 0.55 : 0.88);
    sz[i] = Math.pow(Math.random(), 6) * 3.2 + 0.6;
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
  return g;
}

  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
});

    ' col += vec3(0.012,0.012,0.02);',
    ' gl_FragColor = vec4(col, 1.0); }'].join('\n'),
  side: THREE.BackSide, depthWrite: false
});
// bake the nebula once into a cubemap: zero per-frame cost
var neb = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 32), nebMat);
var nebScene = new THREE.Scene(); nebScene.add(neb);
try {
  var cubeRT = new THREE.WebGLCubeRenderTarget(isSmall ? 256 : 512, { type: THREE.HalfFloatType, generateMipmaps: false, minFilter: THREE.LinearFilter });
  var cubeCam = new THREE.CubeCamera(1, 2000, cubeRT);
  nebScene.add(cubeCam);
  nebScene.rotation.set(0.35, 0, 0.5);
  cubeCam.update(renderer, nebScene);
  scene.background = cubeRT.texture;
} catch(e){ scene.background = new THREE.Color(0x03040a); }

// ---------- POST ----------
var composer = null, bloom = null, finalPass = null;
function makeComposer(){
  var rt = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });
  composer = new THREE.EffectComposer(renderer, rt);
  composer.setPixelRatio(dpr);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.95, 0.55, 0.78);
  composer.addPass(bloom);
  finalPass = new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;',
      'void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;',
      ' c = c / (1.0 + max(c - 1.0, 0.0)*0.6);',   // soft shoulder for highlights
      ' vec2 v = vUv - 0.5; c *= 1.0 - dot(v,v)*0.7;',
      ' float gr = fract(sin(dot(vUv*vec2(1733.1,917.3) + uTime, vec2(12.9898,78.233)))*43758.5453);',
      ' c += (gr - 0.5) * 0.018;',
      ' gl_FragColor = vec4(c, 1.0); }'
    ].join('\n')
  });
  composer.addPass(finalPass);
}
try { makeComposer(); } catch(e){ composer = null; }

// ---------- CAMERA RIG ----------
var focus = new THREE.Vector3(), focusFrom = new THREE.Vector3();
var theta = 0.6, phi = 0.42, dist = 60, thetaT = 0.6, phiT = 0.42, distT = 60;
var overviewDist = 60;
var fly = { t: 1, dur: 1.8, from: 0, to: 0, arc: 0 };
var viewOffX = 0, viewOffY = 0, viewOffXT = 0, viewOffYT = 0;
var W = 1, H = 1;
var tmpV = new THREE.Vector3();

function computeOverview(){
  var aspect = W / H;
  overviewDist = aspect < 1 ? 27 * 2.6 / Math.max(0.5, aspect) * 0.62 : 27 * 2.2 / Math.min(1.5, aspect) * 1.0;
}
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  renderer.setPixelRatio(dpr); renderer.setSize(W, H, false);
  if (composer){ composer.setPixelRatio(dpr); composer.setSize(W, H); bloom.resolution.set(W * dpr / 2, H * dpr / 2); }
  camera.aspect = W / H; camera.updateProjectionMatrix();
  starMat.uniforms.uPx.value = dpr;
  computeOverview();
  if (!selected){ distT = overviewDist; }
  updatePanelOffset();
}
function updatePanelOffset(){
  if (selected){
    if (W > 760){ viewOffXT = Math.min(400, W) * 0.5; viewOffYT = 0; }
    else { viewOffXT = 0; viewOffYT = Math.min(H * 0.62, 420) * 0.5; }
  } else { viewOffXT = 0; viewOffYT = 0; }
}
window.addEventListener('resize', resize);
resize();
dist = overviewDist * 1.9; distT = overviewDist; phi = 0.9;

function startFly(toDist){
  focusFrom.copy(focus);
  fly.from = dist; fly.to = toDist; fly.t = 0;
  fly.dur = reduced ? 0.6 : 1.9;
  fly.arc = Math.max(0, Math.min(18, focusFrom.distanceTo(selected ? selected.wp : tmpV.set(0,0,0)) * 0.35));
}
selectHook = function(b){
  if (b){
    var d = b.id === 'sun' ? b.r * 7.5 : b.r * (b.ring ? 7.2 : 5.4);
    if (W < 760) d *= 1.35;
    startFly(d);
    phiT = 0.18;
  } else {
    startFly(overviewDist);
    phiT = 0.42;
  }
  updatePanelOffset();
};

// ---------- INPUT ----------
var ptrs = new Map(), downX = 0, downY = 0, moved = 0, pinchD = 0;
var ndc = new THREE.Vector2(9, 9), ptrDirty = false, hovered = null;
var raycaster = new THREE.Raycaster();
canvas.addEventListener('pointerdown', function(e){
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  downX = e.clientX; downY = e.clientY; moved = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  if (ptrs.size === 2){ var a = Array.from(ptrs.values()); pinchD = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); }
});
canvas.addEventListener('pointermove', function(e){
  ndc.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1); ptrDirty = true;
  var p = ptrs.get(e.pointerId); if (!p) return;
  var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 1){
    thetaT -= dx * 0.005; phiT = Math.max(-1.2, Math.min(1.35, phiT + dy * 0.004));
    if (moved > 4) canvas.classList.add('drag');
  } else if (ptrs.size === 2){
    var a = Array.from(ptrs.values()); var d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    if (pinchD > 0){ distT = clampDist(distT * pinchD / d); } pinchD = d;
  }
});
function up(e){
  var wasTap = ptrs.size === 1 && moved < 8;
  ptrs.delete(e.pointerId); canvas.classList.remove('drag');
  if (wasTap && e.type === 'pointerup'){
    ndc.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1);
    var hit = pick();
    if (hit && hit !== selected) select(hit);
  }
}
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('pointerleave', function(){ ndc.set(9, 9); ptrDirty = true; });
function clampDist(d){
  var mn = selected ? selected.r * 2.4 : 8, mx = selected ? selected.r * 30 : overviewDist * 2.2;
  return Math.max(mn, Math.min(mx, d));
}
canvas.addEventListener('wheel', function(e){ e.preventDefault(); distT = clampDist(distT * Math.exp(e.deltaY * 0.0012)); }, { passive: false });
window.addEventListener('keydown', function(e){
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === ' ' && e.target === document.body){ e.preventDefault(); pauseBtn.click(); }
});

function pick(){
  raycaster.setFromCamera(ndc, camera);
  var ray = raycaster.ray, best = null, bestT = 1e9;
  for (var i = 0; i < BODIES.length; i++){
    var b = BODIES[i];
    var camD = camera.position.distanceTo(b.wp);
    var rr = Math.max(b.r * 1.3, camD * 0.03);
    if (ray.distanceSqToPoint(b.wp) < rr * rr){
      var tt = tmpV.copy(b.wp).sub(ray.origin).dot(ray.direction);
      if (tt > 0 && tt < bestT){ bestT = tt; best = b; }
    }
  }
  return best;
}

// ---------- LOOP ----------
var running = true, raf = 0, last = performance.now();
function kick(){
  var want = !document.hidden && onscreen;
  if (want && !running){ running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  else if (!want) running = false;
}
var onscreen = true;
document.addEventListener('visibilitychange', kick);
if ('IntersectionObserver' in window) new IntersectionObserver(function(es){ onscreen = es[0].isIntersecting; kick(); }).observe(canvas);

var simT = 0, realT = 0, frames = 0, acc = 0, tuned = false;
function ease(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

function frame(now){
  if (!running) return;
  raf = requestAnimationFrame(frame);
  var rawDt = (now - last) / 1000; var dt = Math.min(0.05, rawDt); last = now;
  realT += dt;
  var sdt = paused ? 0 : dt * timeScale;
  simT += sdt;

  // adaptive quality from the first ~60 frames
  frames++;
  if (!tuned && frames > 10){
    acc += rawDt;
    var n = frames - 10;
    if (n === 60 || (n >= 8 && acc / n > 0.08)){
      tuned = true;
      var avg = acc / n;
      if (avg > 0.022){
        dpr = Math.max(0.75, Math.min(dpr, 1) * (avg > 0.04 ? 0.75 : 1));
        if (avg > 0.03 && bloom) bloom.enabled = false;
        stars.geometry.setDrawRange(0, Math.floor(STAR_N * 0.5));
        resize();
      }
    }
  }

  // orbits
  for (var i = 1; i < BODIES.length; i++){
    var b = BODIES[i];
    b.angle += b.omega * sdt;
    b.holder.position.set(Math.cos(b.angle) * b.R, 0, -Math.sin(b.angle) * b.R);
    b.mesh.rotation.y += b.spin * sdt;
    b.holder.getWorldPosition(b.wp);
    var tm = b.trail.uniforms;
    tm.uA.value = (b.angle / (Math.PI * 2)) % 1;
    var boostT = (b === hovered || b === selected) ? 1 : 0;
    tm.uBoost.value += (boostT - tm.uBoost.value) * 0.1;
    var dimT = selected && selected !== b ? 0.35 : 1;
    tm.uDim.value += (dimT - tm.uDim.value) * 0.06;
  }
  for (var m = 0; m < moons.length; m++){
    var mo = moons[m]; mo.a += mo.s * sdt;
    mo.mesh.position.set(Math.cos(mo.a) * mo.d, 0, Math.sin(mo.a) * mo.d);
    mo.mesh.rotation.y = mo.a;
  }
  for (var pm = 0; pm < planetMats.length; pm++) planetMats[pm].uniforms.uTime.value = simT * 4 + realT * 0.3;
  sunMat.uniforms.uTime.value = realT; coronaMat.uniforms.uTime.value = realT;
  starMat.uniforms.uTime.value = realT;
  if (finalPass) finalPass.uniforms.uTime.value = realT % 10;

  // camera
  if (!selected && !ptrs.size && !reduced) thetaT += dt * 0.02;
  theta += (thetaT - theta) * 0.08;
  phi += (phiT - phi) * 0.06;
  var target = selected ? selected.wp : null;
  if (fly.t < 1){
    fly.t = Math.min(1, fly.t + dt / fly.dur);
    var e = ease(fly.t);
    if (target) focus.lerpVectors(focusFrom, target, e); else { tmpV.set(0,0,0); focus.lerpVectors(focusFrom, tmpV, e); }
    dist = fly.from + (fly.to - fly.from) * e + Math.sin(Math.PI * fly.t) * fly.arc;
    distT = fly.to;
  } else {
    if (target) focus.copy(target); else focus.multiplyScalar(0.9);
    dist += (distT - dist) * 0.08;
  }
  var cp = Math.cos(phi);
  camera.position.set(focus.x + dist * cp * Math.sin(theta), focus.y + dist * Math.sin(phi), focus.z + dist * cp * Math.cos(theta));
  camera.lookAt(focus);
  viewOffX += (viewOffXT - viewOffX) * 0.07; viewOffY += (viewOffYT - viewOffY) * 0.07;
  if (Math.abs(viewOffX) > 0.5 || Math.abs(viewOffY) > 0.5) camera.setViewOffset(W, H, viewOffX, viewOffY, W, H);
  else if (camera.view && camera.view.enabled) camera.clearViewOffset();
  sky.position.copy(camera.position);
  corona.quaternion.copy(camera.quaternion);

  // hover
  if (ptrDirty && !ptrs.size){
    ptrDirty = false;
    var h = pick();
    if (h !== hovered){ hovered = h; canvas.classList.toggle('hover', !!h); BODIES.forEach(function(x){ x.lbl.classList.toggle('on', x === h || x === selected); }); }
  }

  // labels (transform only)
  if (!selected){
    var th = Math.tan(camera.fov * Math.PI / 360);
    for (var li = 0; li < BODIES.length; li++){
      var bb = BODIES[li];
      tmpV.copy(bb.wp).project(camera);
      var vis = tmpV.z < 1;
      var cd = camera.position.distanceTo(bb.wp);
      var pr = bb.r / (cd * th) * H * 0.5;
      var x = (tmpV.x * 0.5 + 0.5) * W + pr * 0.75 + 6, y = (-tmpV.y * 0.5 + 0.5) * H - pr * 0.75 - 12;
      if (!vis){ x = -999; y = -999; }
      if (Math.abs(x - bb.lx) > 0.3 || Math.abs(y - bb.ly) > 0.3){
        bb.lx = x; bb.ly = y; bb.lbl.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
      }
    }
  }

  if (composer) composer.render(); else renderer.render(scene, camera);
}
raf = requestAnimationFrame(frame);
}
})();
</script>
