<style>
:root{
  color-scheme:dark;
  --bg:#03040a;
  --panel:rgba(8,9,16,.72);
  --panel-solid:#0a0b13;
  --ink:#ece6da;
  --ink-dim:#a39d92;
  --ink-faint:#5d5a55;
  --gold:#f2b45a;
  --gold-hot:#ffd79a;
  --teal:#6fd8c6;
  --rule:rgba(236,230,218,.14);
  --serif:"Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono:"DM Mono", ui-monospace, Menlo, Consolas, monospace;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
::selection{background:var(--gold);color:#000}
button{font:inherit;color:inherit}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.hover{cursor:pointer}
#gl.drag{cursor:grabbing}
.nogl{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%, #ffcf7a 0, #f29a3a 3%, #4a1c08 9%, #120a10 30%, var(--bg) 70%)}

.ui{position:fixed;inset:0;pointer-events:none;
  padding-top:max(18px, env(safe-area-inset-top,0px));padding-bottom:max(16px, env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.ui > *{pointer-events:auto}

.brand{position:absolute;top:max(18px, env(safe-area-inset-top,0px));left:max(20px, env(safe-area-inset-left,0px));max-width:420px}
.brand .k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.brand h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5vw,68px);line-height:.92;margin:6px 0 8px;letter-spacing:-.01em}
.brand h1 i{color:var(--gold-hot)}
.brand p{margin:0;color:var(--ink-dim);font-size:13px}

.index{position:absolute;left:max(20px, env(safe-area-inset-left,0px));top:50%;transform:translateY(-40%);list-style:none;margin:0;padding:0}
.index li{margin:2px 0}
.index button{background:none;border:0;padding:6px 0;cursor:pointer;display:flex;gap:12px;align-items:baseline;color:var(--ink-dim);font-size:13px;transition:color .2s}
.index button .n{color:var(--ink-faint);font-size:11px;width:22px}
.index button .dot{width:8px;height:8px;border-radius:50%;display:inline-block;transform:translateY(-1px)}
.index button:hover,.index button[aria-current="true"]{color:var(--ink)}
.index button[aria-current="true"] .nm{border-bottom:1px solid var(--gold)}
.index .h{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}

.foot{position:absolute;left:max(20px, env(safe-area-inset-left,0px));right:max(20px, env(safe-area-inset-right,0px));bottom:max(16px, env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;pointer-events:none}
.foot > *{pointer-events:auto}
.time{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--rule);padding:10px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12px}
.time label{color:var(--ink-dim);letter-spacing:.12em;text-transform:uppercase;font-size:10px}
.time output{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold-hot)}
.time input[type=range]{-webkit-appearance:none;appearance:none;width:170px;height:20px;background:transparent;cursor:pointer}
.time input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--gold) var(--p,25%),var(--rule) var(--p,25%))}
.time input[type=range]::-moz-range-track{height:2px;background:var(--rule)}
.time input[type=range]::-moz-range-progress{height:2px;background:var(--gold)}
.time input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold-hot);margin-top:-6px;box-shadow:0 0 12px var(--gold)}
.time input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold-hot);border:0}
.time button{background:none;border:1px solid var(--rule);padding:3px 8px;cursor:pointer;font-size:11px}
.hint{color:var(--ink-faint);font-size:11px;text-align:right;line-height:1.6}
.contact-mini{font-size:12px;color:var(--ink-dim);text-align:right}
.contact-mini a{text-decoration:none;border-bottom:1px solid var(--rule);margin-left:12px}
.contact-mini a:hover{color:var(--ink);border-color:var(--gold)}

.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:4px 6px;cursor:pointer;white-space:nowrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.85;will-change:transform;transition:opacity .35s, color .2s;text-shadow:0 0 8px #000, 0 0 2px #000}
.lbl::before{content:"";display:inline-block;width:14px;height:1px;background:currentColor;vertical-align:middle;margin-right:6px;opacity:.6}
.lbl:hover,.lbl.on{color:var(--gold-hot);opacity:1}
.labels.hide .lbl{opacity:0;pointer-events:none}

.panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:linear-gradient(90deg, rgba(3,4,10,0) 0%, rgba(3,4,10,.86) 18%, rgba(3,4,10,.94) 100%);
  padding:max(28px, env(safe-area-inset-top,0px)) max(28px, env(safe-area-inset-right,0px)) 28px 64px;display:flex;flex-direction:column;justify-content:center;
  transform:translateX(105%);transition:transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:auto}
.panel.open{transform:none}
.panel .back{align-self:flex-start;background:none;border:1px solid var(--rule);padding:8px 12px;cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:34px}
.panel .back:hover{border-color:var(--gold);color:var(--gold-hot)}
.panel .kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.panel h2{font-family:var(--serif);font-weight:400;font-size:clamp(44px,5vw,64px);line-height:.95;margin:10px 0 16px}
.panel h2 i{color:var(--gold-hot)}
.panel .lede{font-family:var(--serif);font-size:24px;line-height:1.25;margin:0 0 14px;color:var(--ink)}
.panel .body{color:var(--ink-dim);font-size:13px;line-height:1.7;margin:0 0 20px}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 24px;font-size:12px;border-top:1px solid var(--rule);padding-top:14px}
.panel dt{color:var(--ink-faint);text-transform:uppercase;letter-spacing:.12em;font-size:10px;padding-top:2px}
.panel dd{margin:0;color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:var(--gold);color:#140c02;text-decoration:none;padding:12px 16px;font-size:13px;border:0;cursor:pointer}
.cta:hover{background:var(--gold-hot)}
.cta + .cta{margin-top:10px}
.gate-wrap{min-height:140px;margin-top:20px;border-top:1px solid var(--rule);padding-top:14px}
.gate-wrap[hidden]{display:none}
.gate-note{color:var(--ink-dim);font-size:12px;margin:0 0 10px}
.linkbtn{background:none;border:0;border-bottom:1px solid var(--rule);padding:0;cursor:pointer;font-size:12px;color:var(--ink-dim)}
.linkbtn:hover{color:var(--ink);border-color:var(--gold)}
.ctas{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

@media (max-width:760px){
  .brand h1{font-size:40px}
  .brand p{font-size:12px}
  .index{top:auto;bottom:calc(max(16px, env(safe-area-inset-bottom,0px)) + 64px);left:0;right:0;transform:none;display:flex;gap:6px;overflow-x:auto;padding:0 max(16px, env(safe-area-inset-left,0px));scrollbar-width:none}
  .index::-webkit-scrollbar{display:none}
  .index .h{display:none}
  .index li{flex:none;margin:0}
  .index button{background:var(--panel);border:1px solid var(--rule);padding:8px 10px;gap:8px}
  .index button .n{display:none}
  .foot{left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px))}
  .time{width:100%;justify-content:space-between;padding:8px 12px}
  .time input[type=range]{flex:1;width:auto;min-width:0}
  .foot .right{display:none}
  .panel{top:auto;width:100%;height:auto;max-height:62vh;max-height:62dvh;overflow-y:auto;justify-content:flex-start;
    background:linear-gradient(180deg, rgba(3,4,10,0) 0%, rgba(3,4,10,.92) 14%, rgba(3,4,10,.97) 100%);
    padding:40px max(16px, env(safe-area-inset-right,0px)) max(20px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));transform:translateY(105%)}
  .panel .back{margin-bottom:16px}
  .panel h2{font-size:44px;margin:6px 0 10px}
  .panel .lede{font-size:20px}
  .lbl{font-size:10px}
}
@media (max-width:760px){ body.focused .index, body.focused .foot{opacity:0;pointer-events:none} .index,.foot{transition:opacity .4s} }
@media (prefers-reduced-motion:reduce){ .panel{transition:none} }
</style>

  var I = b.info;

' vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));',

' vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);',
' vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));',
' vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;',

' vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));',
' p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;',
' vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;',
' return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));',
'}',
'float fbm(vec3 p, int oct){ float a=0.5, s=0.0; for(int i=0;i<7;i++){ if(i>=oct) break; s+=a*snoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=0.5; } return s; }',

'#else',
' float c = cells(q*4.0); float c2 = cells(q*9.0+7.0);',

  var pos = new Float32Array(n * 3), col = new Float32Array(n * 3), sz = new Float32Array(n);

    var u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);

    if (i % 3 === 0){ u = (Math.random() - 0.5) * 0.35; s = Math.sqrt(1 - u * u); }
    pos[i*3] = s * Math.cos(th) * 600; pos[i*3+1] = u * 600; pos[i*3+2] = s * Math.sin(th) * 600;
    var tt = Math.random();
    col[i*3] = tt < 0.3 ? 0.75 : 1.0; col[i*3+1] = tt < 0.3 ? 0.85 : (tt > 0.85 ? 0.75 : 0.95); col[i*3+2] = tt < 0.3 ? 1.0 : (tt > 0.85 ? 0.55 : 0.88);
    sz[i] = Math.pow(Math.random(), 6) * 3.2 + 0.6;
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(sz, 1));
  return g;
}

    txt(ctx, 'COINS ' + this.coins, VW - 8, 5, P[10], 'r');
    if (this.toast > 0) txt(ctx, this.toastMsg, VW / 2, 40, P[11], 'c');
    if (this.st === 'ready') {
      panelBox(ctx, 40, 52, 240, 56);
      txt(ctx, 'REACH THE FLAG', VW / 2, 60, P[10], 'c');
      txt(ctx, 'MOVE + JUMP. STOMP BUGS', VW / 2, 74, P[7], 'c');
      if ((this.time * 2 | 0) & 1 || reduced()) txt(ctx, touchOn ? 'TAP JUMP TO START' : 'PRESS SPACE TO START', VW / 2, 92, P[11], 'c');
    } else if (this.st === 'win') {
      var by = reduced() ? 0 : Math.round(Math.sin(this.wt * 10) * 3);
      txt(ctx, 'UNLOCKED!', VW / 2, 56 + by, P[10], 'c');
    }
  };

  /* ---------- seals ---------- */
  var SEAL = {
    j: { s: 0x3001A7, t: 0x5D, p: [SA1, SA2, [181, 230, 114, 29, 71, 215, 8]] },
    general: { s: 0x9E3B1, t: 0xC4, p: [[230, 17, 177, 14, 154, 186, 16, 174], SB1, SB2] }
  };
  function unseal(kind) {
    var v = SEAL[kind], a = [].concat.apply([], v.p), s = v.s >>> 0, out = '';
    for (var i = 0; i < a.length; i++) {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      out += String.fromCharCode(a[i] ^ (s >>> 24) ^ ((i * 29 + v.t) & 255));
    }
    return out;
  }

  /* ---------- clipboard ---------- */
  function selectNode(n) {
    try { var r = D.createRange(); r.selectNodeContents(n); var s = W.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  }
  function copyEmail(btn, text, node) {
    var reset = function () { setTimeout(function () { btn.textContent = 'Copy'; }, 1800); };
    var ok = function () { btn.textContent = 'Copied'; reset(); };
    var fail = function () { selectNode(node); btn.textContent = 'Selected - copy it'; reset(); };
    try {
      if (W.navigator.clipboard && W.navigator.clipboard.writeText) W.navigator.clipboard.writeText(text).then(ok, fail);
      else fail();
    } catch (e) { fail(); }
  }

  /* ---------- modal + engine ---------- */
  var M = null, cur = null, raf = 0, last = 0, acc = 0, touchOn = false, ptr = null, prevOverflow = '';
  var input = { left: false, right: false, down: false, jump: false, jp: false };
  function clearInput() { input.left = input.right = input.down = input.jump = input.jp = false; ptr = null; }
  function press(a) { audioInit(); if (a === 'jump') { if (!input.jump) input.jp = true; input.jump = true; } else input[a] = true; }
  function release(a) { input[a] = false; }

  function holdBtn(b, act) {
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault(); touchOn = true;
      try { b.setPointerCapture(e.pointerId); } catch (x) {}
      b.classList.add('kcg-on'); press(act);
    });
    var up = function () { b.classList.remove('kcg-on'); release(act); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    b.addEventListener('click', function (e) { if (e.detail === 0) { press(act); setTimeout(function () { release(act); }, 120); } });
  }

  function buildModal() {
    var ov = el('div', 'kcg-root kcg-overlay kcg-hide');
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'kcg-title');
    var panel = el('div', 'kcg-panel');
    var bar = el('div', 'kcg-bar');
    var title = el('h2', 'kcg-title'); title.id = 'kcg-title';
    var mute = mkBtn('kcg-ghost kcg-sm', '');
    var close = mkBtn('kcg-sm', 'X'); close.setAttribute('aria-label', 'Close game');
    bar.appendChild(title); bar.appendChild(mute); bar.appendChild(close);
    var play = el('div', 'kcg-play');
    var tl = el('div', 'kcg-tl'), tr = el('div', 'kcg-tr');
    var stage = el('div', 'kcg-stage'), screen = el('div', 'kcg-screen');
    var c = cnv(VW, VH); c.tabIndex = 0;
    c.setAttribute('role', 'img');
    var rv = el('div', 'kcg-reveal kcg-hide');
    var retry = mkBtn('kcg-retry kcg-hide', 'Retry');
    retry.setAttribute('aria-label', 'Retry the run');
    screen.appendChild(c); screen.appendChild(retry); screen.appendChild(rv); stage.appendChild(screen);
    var keep = el('div', 'kcg-keep kcg-hide');
    play.appendChild(tl); play.appendChild(stage); play.appendChild(tr);
    var hint = el('p', 'kcg-hint');
    var sr = el('div', 'kcg-sr'); sr.setAttribute('aria-live', 'polite');
    panel.appendChild(bar); panel.appendChild(play); panel.appendChild(keep); panel.appendChild(hint); panel.appendChild(sr);
    ov.appendChild(panel);
    D.body.appendChild(ov);
    M = { ov: ov, panel: panel, bar: bar, title: title, mute: mute, close: close, play: play, tl: tl, tr: tr, stage: stage, screen: screen, c: c, ctx: c.getContext('2d'), rv: rv, hint: hint, sr: sr, retry: retry, keep: keep };
    M.ctx.imageSmoothingEnabled = false;
    var setMute = function () { mute.textContent = muted ? 'SOUND OFF' : 'SOUND ON'; mute.setAttribute('aria-pressed', muted ? 'true' : 'false'); };
    setMute();
    mute.addEventListener('click', function () { muted = !muted; sset('mute', muted ? '1' : null); setMute(); if (!muted) { audioInit(); SFX.coin(); } });
    close.addEventListener('click', function () { closeModal(); });
    retry.addEventListener('click', function () {
      if (!cur || !cur.game.retry) return;
      audioInit(); cur.game.retry(); syncRetry();
      try { c.focus({ preventScroll: true }); } catch (x) {}
    });
    c.addEventListener('pointerdown', function (e) {
      if (!cur || cur.revealed) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      try { c.focus({ preventScroll: true }); } catch (x) {}
      if (e.pointerType === 'touch' && !touchOn) { touchOn = true; layoutTouch(); fit(); }
      ptr = { id: e.pointerId, y: e.clientY, duck: false };
      press('jump');
    });
    c.addEventListener('pointermove', function (e) {
      if (ptr && e.pointerId === ptr.id && cur && cur.kind === 'j' && !ptr.duck && e.clientY - ptr.y > 26) { ptr.duck = true; input.down = true; release('jump'); }
    });
    var up = function (e) { if (ptr && e.pointerId === ptr.id) { release('jump'); if (ptr.duck) input.down = false; ptr = null; } };
    c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    c.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    return M;
  }

  function layoutTouch() {
    if (!M || !cur) return;
    M.tl.textContent = ''; M.tr.textContent = '';
    var show = touchOn && !cur.revealed;
    M.tl.classList.toggle('kcg-hide', !show); M.tr.classList.toggle('kcg-hide', !show);
    if (!show) return;
    var mk = function (label, act, big, arrow) {
      var b = mkBtn('kcg-tbtn' + (big ? ' kcg-big' : ''), arrow ? '' : label);
      b.setAttribute('aria-label', label);
      if (arrow) { var a = el('span', 'kcg-arr' + (arrow === 'l' ? ' kcg-l' : '')); b.appendChild(a); }
      holdBtn(b, act); return b;
    };
    if (cur.kind === 'j') { M.tl.appendChild(mk('DUCK', 'down')); M.tr.appendChild(mk('JUMP', 'jump', true)); }
    else { M.tl.appendChild(mk('Move left', 'left', false, 'l')); M.tl.appendChild(mk('Move right', 'right', false, 'r')); M.tr.appendChild(mk('JUMP', 'jump', true)); }
  }

  function fit() {
    if (!M || !cur) return;
    var ow = M.ov.clientWidth, oh = M.ov.clientHeight;
    var touch = touchOn && !cur.revealed, land = touch && ow > oh;
    M.panel.classList.toggle('kcg-land', land);
    M.hint.classList.toggle('kcg-hide', oh < 520 || touch);
    var barH = M.bar.offsetHeight, hintH = M.hint.classList.contains('kcg-hide') ? 0 : M.hint.offsetHeight + 8;
    var tw = 0, th = M.keep.classList.contains('kcg-hide') ? 0 : M.keep.offsetHeight + 8;
    if (touch) {
      if (land) tw = M.tl.offsetWidth + M.tr.offsetWidth + 16;
      else th += Math.max(M.tl.offsetHeight, M.tr.offsetHeight) + 8;
    }
    var availW = ow - 16 - 24 - tw, availH = oh - 16 - 24 - barH - 8 - hintH - th;
    var s = Math.min(availW / VW, availH / VH);
    if (s >= 2) s = Math.floor(s);
    s = Math.max(0.5, s);
    var w = Math.floor(VW * s), h = Math.floor(VH * s);
    M.c.style.width = w + 'px'; M.c.style.height = h + 'px';
    M.screen.style.width = w + 'px'; M.screen.style.height = h + 'px';
    M.panel.style.width = (w + tw + 24) + 'px';
    var es = M.rv.querySelector('.kcg-mail');
    if (es) es.style.fontSize = Math.max(8, Math.min(18, Math.floor((w - 40) / (es.textContent.length + 1)))) + 'px';
  }

  function frame(t) {
    raf = W.requestAnimationFrame(frame);
    if (!cur) return stopLoop();
    if (!last) last = t;
    var dt = (t - last) / 1000; last = t;
    if (dt > 0.25) dt = 0.25;
    acc += dt;
    var n = 0;
    while (acc >= STEP && n < 10) { cur.game.update(STEP, input); acc -= STEP; n++; }
    if (n >= 10) acc = 0;
    cur.game.render(M.ctx);
    syncRetry();
  }
  function syncRetry() {
    var show = !!(cur && !cur.revealed && cur.game.st === 'dead');
    if (show !== !M.retry.classList.contains('kcg-hide')) {
      M.retry.classList.toggle('kcg-hide', !show);
      if (!show && D.activeElement === M.retry) { try { M.c.focus({ preventScroll: true }); } catch (x) {} }
    }
  }
  function syncKeep() {
    var k = M.keep; k.textContent = '';
    var show = !!(cur && !cur.revealed && isOpen(cur.kind));
    k.classList.toggle('kcg-hide', !show);
    if (!show) return;
    var email = unseal(cur.kind), mail = el('span', 'kcg-mail', email), cp = mkBtn('kcg-sm', 'Copy');
    cp.setAttribute('aria-label', 'Copy email');
    cp.addEventListener('click', function () { copyEmail(cp, email, mail); });
    k.appendChild(el('span', null, 'Unlocked:')); k.appendChild(mail); k.appendChild(cp);
  }
  function startLoop() { if (!raf && cur && !D.hidden) { last = 0; acc = 0; raf = W.requestAnimationFrame(frame); } }
  function stopLoop() { if (raf) W.cancelAnimationFrame(raf); raf = 0; }

  function newGame() {
    var api = {
      say: function (m) { if (M) M.sr.textContent = m; },
      win: function () { reveal(); }
    };
    cur.game = cur.kind === 'j' ? new Runner(api) : new Plat(api);
    M.c.setAttribute('aria-label', cur.kind === 'j' ? 'Runner game. Press Space to jump, Down to duck. Reach 300 to unlock the email.' : 'Platform game. Arrow keys to move, Space to jump. Reach the flag to unlock the email.');
  }

  function reveal() {
    if (!cur || cur.revealed) return;
    var kind = cur.kind, email = unseal(kind);
    cur.revealed = true;
    sset('u.' + kind, '1');
    var rv = M.rv; rv.textContent = '';
    rv.appendChild(el('p', 'kcg-rvh', 'UNLOCKED: ' + LABEL[kind].toUpperCase()));
    var mail = el('span', 'kcg-mail', email);
    rv.appendChild(mail);
    var row = el('div', 'kcg-rvrow');
    var cp = mkBtn('kcg-sm', 'Copy');
    cp.addEventListener('click', function () { copyEmail(cp, email, mail); });
    var a = el('a', 'kcg-link', 'Open in mail app'); a.href = 'mailto:' + email;
    row.appendChild(cp); row.appendChild(a);
    rv.appendChild(row);
    var again = mkBtn('kcg-ghost kcg-sm', 'Play again');
    again.addEventListener('click', function () { cur.revealed = false; rv.classList.add('kcg-hide'); rv.textContent = ''; newGame(); syncKeep(); layoutTouch(); fit(); try { M.c.focus({ preventScroll: true }); } catch (e) {} });
    rv.appendChild(again);
    rv.classList.remove('kcg-hide');
    clearInput(); syncRetry(); syncKeep(); layoutTouch(); fit();
    M.sr.textContent = 'Unlocked. The email address is ' + email;
    try { cp.focus({ preventScroll: true }); } catch (e) {}
    renderAll();
  }

  function focusables() {
    var list = M.ov.querySelectorAll('button, a[href], canvas[tabindex]'), out = [];
    for (var i = 0; i < list.length; i++) if (list[i].offsetParent !== null || list[i].getClientRects().length) out.push(list[i]);
    return out;
  }
  var KEYMAP = { ' ': 'jump', Spacebar: 'jump', ArrowUp: 'jump', w: 'jump', W: 'jump', z: 'jump', Z: 'jump', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', Enter: 'jump' };
  function onKeyDown(e) {
    if (!cur) return;
    e.stopPropagation();
    if (e.key === 'Escape' || e.key === 'Esc') { e.preventDefault(); closeModal(); return; }
    if (e.key === 'Tab') {
      var f = focusables(); if (!f.length) return;
      var i = f.indexOf(D.activeElement);
      e.preventDefault();
      var n = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i < 0 || i === f.length - 1 ? 0 : i + 1);
      f[n].focus();
      return;
    }
    var act = KEYMAP[e.key];
    if (!act) return;
    var t = e.target, onCtl = t && t !== M.c && t.closest && t.closest('button, a');
    if (onCtl && (e.key === ' ' || e.key === 'Enter' || e.key === 'Spacebar')) return;
    if (cur.revealed) return;
    e.preventDefault();
    if (e.repeat && act === 'jump') return;
    press(act);
  }
  function onKeyUp(e) {
    if (!cur) return;
    e.stopPropagation();
    var act = KEYMAP[e.key];
    if (act) release(act);
  }
  function onFocusIn(e) { if (cur && M && !M.ov.contains(e.target)) { try { M.c.focus({ preventScroll: true }); } catch (x) {} } }
  function onResize() { fit(); }
  function onBlur() { clearInput(); }

  function openModal(kind, trigger) {
    kind = kind === 'general' ? 'general' : 'j';
    audioInit(); ensureFont();
    if (cur) closeModal(true);
    if (!M) buildModal();
    txtCache = {}; txtN = 0;
    cur = { kind: kind, revealed: false, trigger: trigger || D.activeElement, root: trigger && trigger.closest ? trigger.closest('.kcg-gate') : null };
    clearInput();
    try { if (!touchOn && W.matchMedia && W.matchMedia('(pointer: coarse)').matches) touchOn = true; } catch (e) {}
    M.title.textContent = TITLE[kind];
    M.hint.textContent = HINT[kind];
    M.rv.classList.add('kcg-hide'); M.rv.textContent = '';
    newGame();
    M.ov.classList.remove('kcg-hide');
    syncRetry(); syncKeep();
    prevOverflow = D.documentElement.style.overflow;
    D.documentElement.style.overflow = 'hidden';
    layoutTouch(); fit();
    W.addEventListener('keydown', onKeyDown, true);
    W.addEventListener('keyup', onKeyUp, true);
    W.addEventListener('resize', onResize);
    W.addEventListener('blur', onBlur);
    D.addEventListener('focusin', onFocusIn, true);
    try { M.c.focus({ preventScroll: true }); } catch (e) {}
    startLoop();
  }
  function closeModal(silent) {
    if (!cur) return;
    var c = cur;
    stopLoop(); cur = null; clearInput();
    W.removeEventListener('keydown', onKeyDown, true);
    W.removeEventListener('keyup', onKeyUp, true);
    W.removeEventListener('resize', onResize);
    W.removeEventListener('blur', onBlur);
    D.removeEventListener('focusin', onFocusIn, true);
    M.ov.classList.add('kcg-hide');
    M.rv.textContent = '';
    D.documentElement.style.overflow = prevOverflow;
    if (silent) return;
    var t = c.trigger;
    if (!t || !t.isConnected) {
      var root = (c.root && c.root.isConnected) ? c.root : mounts[0];
      t = root ? root.querySelector('[data-kcg="' + c.kind + '"] button') : null;
    }
    if (t && t.focus) { try { t.focus({ preventScroll: true }); } catch (e) {} }
  }
  D.addEventListener('visibilitychange', function () {
    if (!cur) return;
    if (D.hidden) { stopLoop(); clearInput(); } else startLoop();
  });

  /* ---------- inline gate ---------- */
  var mounts = [];
  function renderGate(root) {
    root.textContent = '';
    var both = isOpen('j') && isOpen('general');
    root.appendChild(el('p', 'kcg-help', both ? 'Both emails unlocked. Nice playing.' : 'Emails are locked. Beat a tiny game to reveal one.'));
    var row = el('div', 'kcg-row');
    KINDS.forEach(function (kind) {
      var item = el('div', 'kcg-item'); item.setAttribute('data-kcg', kind);
      if (isOpen(kind)) {
        var email = unseal(kind), card = el('div', 'kcg-card');
        card.appendChild(el('span', 'kcg-lab', LABEL[kind]));
        var mail = el('span', 'kcg-mail', email);
        var cp = mkBtn('kcg-sm', 'Copy');
        cp.setAttribute('aria-label', 'Copy ' + LABEL[kind] + ' email');
        cp.addEventListener('click', function () { copyEmail(cp, email, mail); });
        var a = el('a', 'kcg-link', 'Email'); a.href = 'mailto:' + email;
        var rp = mkBtn('kcg-ghost kcg-sm', null);
        rp.appendChild(el('span', 'kcg-tri')); rp.appendChild(el('span', null, 'Replay'));
        rp.setAttribute('aria-label', 'Replay the ' + LABEL[kind] + ' game');
        rp.addEventListener('click', function () { openModal(kind, rp); });
        card.appendChild(mail); card.appendChild(cp); card.appendChild(a); card.appendChild(rp);
        item.appendChild(card);
      } else {
        var b = mkBtn('kcg-playbtn', null);
        b.appendChild(el('span', 'kcg-lock'));
        b.appendChild(el('span', null, LABEL[kind] + ' — play to unlock'));
        b.addEventListener('click', function () { openModal(kind, b); });
        item.appendChild(b);
      }
      row.appendChild(item);
    });
    root.appendChild(row);
  }
  function renderAll() {
    mounts = mounts.filter(function (r) { return r.isConnected; });
    mounts.forEach(renderGate);
  }
  function mount(host) {
    if (!host || host.nodeType !== 1) return;
    ensureFont();
    if (host.__kcgRoot && host.__kcgRoot.parentNode === host) { renderGate(host.__kcgRoot); return; }
    var root = el('div', 'kcg-root kcg-gate');
    host.appendChild(root); host.__kcgRoot = root; mounts.push(root);
    renderGate(root);
  }
  function scan() { var list = D.querySelectorAll('[data-contact-gate]'); for (var i = 0; i < list.length; i++) if (!list[i].__kcgRoot) mount(list[i]); }
  var queued = false;
  function queueScan() { if (queued) return; queued = true; setTimeout(function () { queued = false; scan(); }, 0); }
  function init() {
    scan();
    if (W.MutationObserver) {
      new MutationObserver(function (muts) {
        if (queued) return;
        for (var i = 0; i < muts.length; i++) {
          var add = muts[i].addedNodes;
          for (var j = 0; j < add.length; j++) {
            var n = add[j];
            if (n.nodeType !== 1 || (n.classList && n.classList.contains('kcg-root'))) continue;
            if ((n.hasAttribute && n.hasAttribute('data-contact-gate')) || (n.firstElementChild && n.querySelector('[data-contact-gate]'))) { queueScan(); return; }
          }
        }
      }).observe(D.documentElement, { childList: true, subtree: true });
    }
  }
  if (D.readyState === 'loading') D.addEventListener('DOMContentLoaded', init); else init();

  W.KaiavContact = Object.freeze({
    open: function (kind) { openModal(kind, D.activeElement); },
    mount: function (elm) { mount(elm); }
  });

})();
</script>
