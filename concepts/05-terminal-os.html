<title>Kaiav Terminal OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a090c;
  --case:#17151a;
  --case-2:#1f1c23;
  --case-edge:#2c2831;
  --emboss:#77707e;
  --ink:#e8e0d4;
  --muted:#8e8794;
  --phos:#ffa53a;
  --phos-hi:#ffdc8c;
  --phos-glow:rgba(255,165,58,.35);
  --screen:#050506;
}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Chakra Petch",ui-monospace,"SFMono-Regular",Menlo,monospace;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.app{
  height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:
    radial-gradient(120% 80% at 50% 0%,var(--case-2),transparent 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
    var(--case);
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.badge{font-weight:700;font-size:11px;letter-spacing:.18em;color:var(--emboss);border:1px solid var(--case-edge);padding:3px 7px;border-radius:3px;text-shadow:0 1px 0 #000;white-space:nowrap}
.top h1{margin:0;font-size:clamp(15px,2.2vw,20px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.top p{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.leds{display:flex;gap:14px;align-items:center;font-size:10px;letter-spacing:.2em;color:var(--emboss);text-transform:uppercase}
.led{display:inline-flex;align-items:center;gap:6px}
.led i{width:7px;height:7px;border-radius:50%;background:#2a2620;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.led.on i{background:var(--phos);box-shadow:0 0 8px var(--phos),0 0 2px var(--phos-hi)}
.led.act i{transition:background .05s}
.crt{position:relative;min-height:0;border-radius:22px;background:var(--screen);
  box-shadow:0 0 0 1px #000,0 0 0 9px #0e0d10,0 0 0 10px var(--case-edge),inset 0 0 40px #000,0 30px 60px -20px rgba(0,0,0,.8);
  overflow:hidden;margin:10px;cursor:text;touch-action:pan-x}
.crt:focus-within{box-shadow:0 0 0 1px #000,0 0 0 9px #0e0d10,0 0 0 11px var(--phos),inset 0 0 40px #000,0 30px 60px -20px rgba(0,0,0,.8)}
.crt canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cmd{position:absolute;left:0;bottom:0;width:100%;height:2em;opacity:0;font-size:16px;border:0;padding:0;background:transparent;color:transparent;caret-color:transparent;pointer-events:none}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;-webkit-overflow-scrolling:touch;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:600 12px/1 "Chakra Petch",ui-monospace,monospace;letter-spacing:.08em;text-transform:lowercase;color:var(--ink);
  background:linear-gradient(#2a2630,#1b181f);border:1px solid #0b0a0d;border-radius:5px;padding:9px 12px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #050406;transition:transform .08s,color .15s}
.chip:hover{color:var(--phos-hi)}
.chip:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 #050406}
.chip b{color:var(--phos);font-weight:600}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;font-size:12px;color:var(--muted);min-width:0}
.tray{display:flex;flex-wrap:wrap;gap:6px 14px;min-width:0}
.tray a{color:var(--muted);text-decoration:none;letter-spacing:.06em}
.tray a:hover{color:var(--phos-hi)}
.tray a.new{color:var(--phos-hi);text-shadow:0 0 10px var(--phos-glow)}
.deck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center}
.deck-l{display:flex;flex-direction:column;gap:9px;min-width:0}
.gate{min-height:120px;min-width:min(340px,100%);display:flex;flex-direction:column;justify-content:center;gap:6px;border-left:1px solid var(--case-edge);padding-left:18px}
.gate-l{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--emboss)}
@media (max-width:860px){.deck{grid-template-columns:minmax(0,1fr)}.gate{border-left:0;border-top:1px solid var(--case-edge);padding:8px 0 0;min-height:120px;min-width:0}}
a:focus-visible,button:focus-visible{outline:2px solid var(--phos-hi);outline-offset:2px;border-radius:4px}
.nogl .crt{background:radial-gradient(120% 90% at 50% 40%,#17110a,#050404)}
@media (max-width:640px){
  .top p,.leds .led:not(.pwr){display:none}
  .crt{margin:6px;border-radius:16px}
  .app{gap:8px}
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="badge" aria-hidden="true">KN-1</span>

        <a href="https://www.linkedin.com/in/kaiav-nihalani-594703356/" target="_blank" rel="noopener">linkedin ↗</a>
        <a href="https://x.com/KaiavRNihalani" target="_blank" rel="noopener">x ↗</a>

   </section>
  </nav>
</div>
<div id="mirror" class="sr" role="log" aria-live="polite" aria-label="Terminal output"></div>

<script>
(() => {
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 700;
const DPR_CAP = MOBILE ? 1.5 : 2;
const $ = id => document.getElementById(id);
const crt = $('crt'), glc = $('gl'), input = $('cmd'), mirror = $('mirror'), tray = $('tray');
const ledAct = $('ledAct');

/* ---------------- content ---------------- */
const GATE_MSG = 'Emails are locked behind a game \u2014 click Contact';
const unlock = w => { try { window.KaiavContact && window.KaiavContact.open(w); } catch (e) {} };
const LINKS = {
  j:['https://risingfounder.net','risingfounder.net'],
  linkedin:['https://www.linkedin.com/in/kaiav-nihalani-594703356/','linkedin'],
  x:['https://x.com/KaiavRNihalani','x.com/KaiavRNihalani']
};
const FILES = {
  'about.md': [
    '{b:# Kaiav Nihalani}',
    '',
    'Founder of {a:Eden}. Co-founder of {a:J: Rising Founder}.',
    'Building context for agents.',
    '',
    '{d:[ longer bio coming soon ]}',
    '',
    '{d:see also:} {a:cat eden.md}  {a:cat j.md}  {a:contact}'
  ],
  'eden.md': [
    '{b:# Eden}',
    '{d:role}  founder',
    '',
    'Context for agents.'
  ],
  'j.md': [
    '{b:# J: Rising Founder}',
    '{d:role}  co-founder, with Jose Cruz-Lopez',
    '',
    '{b:An early chance for extraordinary founders.}',
    'A free, remote, three-month program for ambitious founders aged 23 and under, anywhere in the world.',
    '',
    '{d:cost}  no fee, no equity',
    '{d:web}   {a:risingfounder.net}'
  ],
  links: {
    'contact.txt': [
      'email     {d:locked}  try {a:unlock j} or {a:unlock mail}',
      'linkedin  {a:linkedin.com/in/kaiav-nihalani-594703356}',
      'x         {a:x.com/KaiavRNihalani}'
    ]
  }
};
const TRAY = {'j.md':'j','contact.txt':'contact'};

const G = {
  K:[' _  __ ','| |/ / ',"| ' /  ",'| . \\  ','|_|\\_\\ '],
  A:['    _    ','   / \\   ','  / _ \\  ',' / ___ \\ ','/_/   \\_\\'],
  I:[' ___ ','|_ _|',' | | ',' | | ','|___|'],
  V:['__     __','\\ \\   / /',' \\ \\ / / ','  \\ V /  ','   \\_/   '],
  N:[' _   _ ','| \\ | |','|  \\| |','| |\\  |','|_| \\_|']
};
const banner = word => [0,1,2,3,4].map(r => [...word].map(c => G[c][r]).join(''));
const LOGO = [
  ' .-------------. ',
  ' |  _  __ _  _ | ',
  " | | |/ /| \\| || ",
  " | | ' / | .` || ",
  ' | |_|\\_\\|_|\\_|| ',
  " '-------------' ",
  '   /|  ___  |\\   ',
  '  /_|_______|_\\  '
];

/* ---------------- text model ---------------- */
const MAXLINES = 600;
const lines = [];
const RE = /\{([adbi]):([^}]*)\}/g;
function parse(s){
  const segs = []; let last = 0, m; RE.lastIndex = 0;
  while ((m = RE.exec(s))) {
    if (m.index > last) segs.push([s.slice(last, m.index), 'n']);
    segs.push([m[2], m[1]]); last = RE.lastIndex;
  }
  if (last < s.length) segs.push([s.slice(last), 'n']);
  return segs;
}
const plain = s => s.replace(RE, '$2');
function mkLine(s){ return {src:s, segs:parse(s), wc:-1, rows:null, set(t){this.src=t;this.segs=parse(t);this.wc=-1;dirty=true;}}; }
function push(s){
  const l = mkLine(s); lines.push(l);
  if (lines.length > MAXLINES) lines.splice(0, lines.length - MAXLINES);
  dirty = true; scroll = 0; return l;
}
// wrap a styled line into rows of <= cols chars, preferring word breaks
function wrap(segs, cols){
  const ch = [], st = [];
  for (const [t, s] of segs) for (const c of t) { ch.push(c); st.push(s); }
  const rows = [];
  if (!ch.length) return [[]];
  let i = 0;
  while (i < ch.length) {
    let end = Math.min(i + cols, ch.length);
    if (end < ch.length) {
      let b = end; while (b > i + (cols >> 1) && ch[b] !== ' ') b--;
      if (b > i + (cols >> 1)) end = b + 1;
    }
    const row = []; let cur = null;
    for (let k = i; k < end; k++) {
      if (!cur || cur[1] !== st[k]) { cur = ['', st[k]]; row.push(cur); }
      cur[0] += ch[k];
    }
    rows.push(row); i = end;
  }
  return rows;
}

/* ---------------- state ---------------- */
let dirty = true, scroll = 0, cwd = [], shellReady = false, themeKey = 'amber';
const hist = []; let hIdx = 0;
const pending = []; // queued output lines
let task = null, taskT = 0; // generator coroutine (boot / chip typing)
const t0 = performance.now();

const THEMES = {
  amber:{c0:[1.0,0.60,0.16], c1:[1.0,0.86,0.52], c2:[1.0,0.95,0.84], css:['#ffa53a','#ffdc8c','rgba(255,165,58,.35)'], direct:['#e8902c','#ffd98a','#fff1dc','#8a5a24']},
  green:{c0:[0.26,1.0,0.46], c1:[0.80,1.0,0.62], c2:[0.88,1.0,0.92], css:['#4dff7c','#c8ffa0','rgba(77,255,124,.3)'], direct:['#3fd86a','#c8ffa0','#e8ffe8','#24703a']},
  ice:{c0:[0.42,0.80,1.0], c1:[1.0,0.72,0.96], c2:[0.92,0.97,1.0], css:['#76d4ff','#ffc0f2','rgba(118,212,255,.3)'], direct:['#6cc4f0','#ffc0f2','#eef8ff','#2f6684']}
};

/* ---------------- text canvas ---------------- */
const tc = document.createElement('canvas');
const tx = tc.getContext('2d', {alpha:false});
let W = 1, H = 1, cssW = 1, cssH = 1, scaleTxt = 1, scaleGL = 1, quality = 1;
let fontPx = 16, cw = 8, chh = 18, cols = 40, rows = 20, padX = 0, padY = 0;
let curRect = [0,0,0,0], curOn = 0;
let fontFamily = '"VT323", ui-monospace, Menlo, monospace';
let useGL = true;

function measure(){
  const css = Math.max(16, Math.min(28, cssW / 54));
  fontPx = Math.round(css * scaleTxt);
  tx.font = fontPx + 'px ' + fontFamily;
  cw = tx.measureText('M').width || fontPx * 0.5;
  chh = Math.round(fontPx * 1.08);
  padX = Math.round(W * (MOBILE ? 0.045 : 0.05));
  padY = Math.round(H * 0.06);
  cols = Math.max(20, Math.floor((W - padX * 2) / cw));
  rows = Math.max(6, Math.floor((H - padY * 2) / chh));
  for (const l of lines) l.wc = -1;
  dirty = true;
}

function promptStr(){ return '{a:kaiav@kn}:{b:' + pathStr(cwd) + '}$ '; }
let promptLine = mkLine('');

function styleColor(s){
  if (useGL) return s === 'n' ? '#d20000' : s === 'd' ? '#700000' : s === 'a' ? '#00ff00' : s === 'b' ? '#0000ff' : '#d20000';
  const d = THEMES[themeKey].direct;
  return s === 'n' ? d[0] : s === 'd' ? d[3] : s === 'a' ? d[1] : d[2];
}
const ASCII = /^[\x20-\x7e]*$/;
function drawRow(row, y){
  let col = 0;
  for (const [t, s] of row) {
    const x = padX + col * cw;
    if (s === 'i') {
      tx.fillStyle = styleColor('n'); tx.fillRect(x, y - chh * 0.78, t.length * cw, chh);
      tx.fillStyle = '#000'; tx.fillText(t, x, y);
    } else {
      tx.fillStyle = styleColor(s);
      if (ASCII.test(t)) tx.fillText(t, x, y);
      else { let k = 0; for (const c of t) { tx.fillText(c, x + (k++) * cw, y); } }
    }
    col += [...t].length;
  }
}
function render(){
  tx.fillStyle = useGL ? '#000' : '#070605'; tx.fillRect(0, 0, W, H);
  tx.font = fontPx + 'px ' + fontFamily; tx.textBaseline = 'alphabetic';
  const vis = [];
  const showPrompt = shellReady && !pending.length && !task;
  let curRow = -1, curCol = 0;
  for (const l of lines) {
    if (l.wc !== cols) { l.rows = wrap(l.segs, cols); l.wc = cols; }
    for (const r of l.rows) vis.push(r);
  }
  if (showPrompt) {
    const pv = promptStr() + escapeMarkup(input.value);
    promptLine.set(pv); dirty = false;
    const pr = wrap(promptLine.segs, cols);
    const plen = plain(promptStr()).length;
    let caret = input.selectionStart == null ? input.value.length : input.selectionStart;
    const pos = plen + caret;
    // map caret position to wrapped rows
    let acc = 0, ri = 0;
    for (; ri < pr.length; ri++) { const len = pr[ri].reduce((a, s) => a + [...s[0]].length, 0); if (pos < acc + len || ri === pr.length - 1) break; acc += len; }
    curRow = vis.length + ri; curCol = pos - acc;
    if (curCol >= cols) { curRow++; curCol = 0; }
    for (const r of pr) vis.push(r);
  }
  const maxScroll = Math.max(0, vis.length - rows);
  if (scroll > maxScroll) scroll = maxScroll;
  const start = Math.max(0, vis.length - rows - scroll);
  const end = Math.min(vis.length, start + rows);
  const base = Math.round(chh * 0.8);
  for (let i = start; i < end; i++) drawRow(vis[i], padY + (i - start) * chh + base);
  if (curRow >= start && curRow < end) {
    const x = padX + curCol * cw, y = padY + (curRow - start) * chh;
    curRect[0] = x / W; curRect[2] = (x + cw) / W;
    curRect[1] = 1 - (y + chh) / H; curRect[3] = 1 - (y + chh * 0.08) / H;
    curOn = 1;
    if (!useGL && document.activeElement === input && ((performance.now() / 400) | 0) % 2 === 0) { tx.fillStyle = styleColor('n'); tx.fillRect(x, y + chh * .08, cw, chh * .92); }
  } else curOn = 0;
  if (scroll > 0) { tx.fillStyle = styleColor('d'); tx.fillText('-- scrollback ' + scroll + ' --', W - padX - 18 * cw, padY + base); }
}
const escapeMarkup = s => s.replace(/[{}]/g, c => c === '{' ? '(' : ')');

/* ---------------- filesystem ---------------- */
function pathStr(p){ return '~' + (p.length ? '/' + p.join('/') : ''); }
function resolve(arg){
  let parts = arg.startsWith('/') || arg.startsWith('~') ? [] : cwd.slice();
  for (const seg of arg.replace(/^~\/?/, '').replace(/^\/(home\/kaiav\/?)?/, '').split('/')) {
    if (!seg || seg === '.') continue;
    if (seg === '..') parts.pop(); else parts.push(seg);
  }
  let node = FILES;
  for (const s of parts) { if (node && typeof node === 'object' && !Array.isArray(node) && s in node) node = node[s]; else return {parts, node:null}; }
  return {parts, node};
}
const isDir = n => n && typeof n === 'object' && !Array.isArray(n);

/* ---------------- commands ---------------- */
const CMDS = {
  help(){ return [
    '{b:available commands}',
    '  {a:help}              this list',
    '  {a:ls} [dir]          list files',
    '  {a:cd} <dir>          change directory',
    '  {a:cat} <file>        print a file   e.g. {a:cat j.md}',
    '  {a:whoami}            who is this',
    '  {a:neofetch}          system info',
    '  {a:contact}           how to reach Kaiav',
    '  {a:unlock} j|mail     unlock an email via a mini-game',
    '  {a:theme} [name]      amber | green | ice',
    '  {a:history}           past commands',
    '  {a:clear}             wipe the screen',
    '{d:also: pwd, echo, date, uname, reboot.  tab completes, up/down recalls.}'
  ]; },
  ls(a){
    const r = resolve(a[0] || '.');
    if (!r.node) return ['ls: cannot access \'' + (a[0]||'') + '\': no such file or directory'];
    if (!isDir(r.node)) return [a[0]];
    const names = Object.keys(r.node).map(k => isDir(r.node[k]) ? '{a:' + k + '/}' : k);
    return [names.join('   ')];
  },
  cd(a){
    const r = resolve(a[0] || '~');
    if (!r.node) return ['cd: no such directory: ' + a[0]];
    if (!isDir(r.node)) return ['cd: not a directory: ' + a[0]];
    cwd = r.parts; return [];
  },
  pwd(){ return ['/home/kaiav' + (cwd.length ? '/' + cwd.join('/') : '')]; },
  cat(a){
    if (!a[0]) return ['usage: cat <file>   try {a:cat about.md}'];
    const out = [];
    for (const f of a) {
      const r = resolve(f);
      if (!r.node) { out.push('cat: ' + f + ': no such file'); continue; }
      if (isDir(r.node)) { out.push('cat: ' + f + ': is a directory'); continue; }
      out.push(...r.node);
      const name = r.parts[r.parts.length - 1];
      if (name in TRAY) trayLink(TRAY[name]);
    }
    return out;
  },
  whoami(){ return ['{b:kaiav nihalani} (he/him)', 'founder of eden. co-founder of j: rising founder.', '{d:building context for agents.}']; },
  neofetch(){
    const up = Math.round((performance.now() - t0) / 1000);
    const info = [
      '{a:kaiav}@{a:kn}',
      '{d:-----------------}',
      '{a:OS}       KN/OS 26.10 retro-future',
      '{a:Host}     Kaiav Nihalani',
      '{a:Kernel}   context for agents',
      '{a:Shell}    knsh 0.1',
      '{a:Uptime}   ' + (up < 60 ? up + 's' : Math.floor(up/60) + 'm ' + (up%60) + 's'),
      '{a:Founder}  Eden',
      '{a:Co-fndr}  J: Rising Founder',
      '{a:Display}  WebGL CRT, ' + themeKey,
      '{a:Mail}     locked (try {a:unlock mail})',
      '',
      '{i:   }{d:{i:   }}{a:###}{b:###}'
    ];
    if (cols < LOGO[0].length + 34) return [...LOGO.map(l => '{a:' + l + '}'), '', ...info];
    const out = [];
    for (let i = 0; i < Math.max(LOGO.length, info.length); i++) out.push('{a:' + (LOGO[i] || ' '.repeat(LOGO[0].length)) + '}  ' + (info[i] || ''));
    return out;
  },
  contact(){
    trayLink('contact');
