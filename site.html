.ui{ position: fixed; z-index: 2; font: 500 11px var(--mono); letter-spacing: .08em; color: var(--dim) }
#hint{ left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); transition: opacity 1.2s; pointer-events: none; text-align: center;

   Keys are real recordings (keysamples.js: one MP3 sprite, decoded once and sliced per class); without them the
   keys stay silent. Events (disk seek, terminal bell, error buzz) are synthesised sample-by-sample into
   AudioBuffers on first use. Playback is a BufferSource -> lowpass -> Gain -> Panner per hit.
   Mix: keys/events -> (dry + short generated room reverb) -> glue compressor -> limiter -> mute -> out. */
(() => {
'use strict';
const M = window.MAC = window.MAC || {};

const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const LS_KEY = 'mac.sound.muted';

/* ---------------- tiny DSP toolkit (pure JS, runs on Float32Arrays) ---------------- */
function rng(seed){
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* RBJ biquad, direct form I. type: 'lp' | 'hp' | 'bp' (constant 0 dB peak). */
function biquad(type, f, Q, sr){
  let b0, b1, b2, a1, a2, x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  function set(fr, q){
    const w = TAU * clamp(fr, 10, sr * 0.45) / sr, c = Math.cos(w), al = Math.sin(w) / (2 * q), a0 = 1 + al;
    if (type === 'lp'){ b0 = (1 - c) / 2; b1 = 1 - c; b2 = b0; }
    else if (type === 'hp'){ b0 = (1 + c) / 2; b1 = -(1 + c); b2 = b0; }
    else { b0 = al; b1 = 0; b2 = -al; }
    b0 /= a0; b1 /= a0; b2 /= a0; a1 = -2 * c / a0; a2 = (1 - al) / a0;
  }
  set(f, Q);
  const p = x => { const y = b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2; x2 = x1; x1 = x; y2 = y1; y1 = y; return y; };
  p.set = set;
  return p;
}
/* Filtered, exponentially decaying noise burst added into out at time t0 (s). */
function burst(out, sr, r, t0, tau, type, f, Q, amp, len){
  const flt = biquad(type, f, Q, sr), i0 = Math.round(t0 * sr), n = Math.min(out.length - i0, Math.round((len || tau * 8) * sr));
  const att = Math.max(2, Math.round(0.00012 * sr));
  for (let i = 0; i < n; i++){
    const t = i / sr, env = Math.exp(-t / tau) * (i < att ? i / att : 1);
    out[i0 + i] += amp * flt((r() * 2 - 1) * env);
  }
  /* let the filter ring out */
  for (let i = n; i < n + Math.round(0.004 * sr) && i0 + i < out.length; i++) out[i0 + i] += amp * flt(0);
}
/* Damped sine (starts at phase 0 with a tiny attack so it never clicks). */
function ring(out, sr, t0, f, tau, amp){
  const i0 = Math.round(t0 * sr), n = Math.min(out.length - i0, Math.round(tau * 9 * sr)), att = Math.round(0.0006 * sr);
  let ph = 0;
  for (let i = 0; i < n; i++){
    const t = i / sr;
    ph += TAU * f / sr;
    out[i0 + i] += amp * Math.sin(ph) * Math.exp(-t / tau) * (i < att ? i / att : 1);
  }
}
/* Fade the tail, kill DC, normalise to `peak`. */
function finish(out, sr, peak, fadeMs){
  let m = 0; for (let i = 0; i < out.length; i++) m += out[i]; m /= out.length;
  const fn = Math.round((fadeMs || 6) * 0.001 * sr);
  let pk = 0;
  for (let i = 0; i < out.length; i++){
    let v = out[i] - m;
    const k = out.length - 1 - i; if (k < fn) v *= k / fn;
    if (i < 8) v *= i / 8;
    if (!isFinite(v)) v = 0;
    out[i] = v; const a = v < 0 ? -v : v; if (a > pk) pk = a;
  }
  if (peak && pk > 0){ const g = peak / pk; for (let i = 0; i < out.length; i++) out[i] *= g; }
  return out;
}
function onePoleLP(out, sr, f){ const a = Math.exp(-TAU * f / sr); let y = 0; for (let i = 0; i < out.length; i++){ y = out[i] + a * (y - out[i]); out[i] = y; } return out; }

/* ---------------- event synthesis ---------------- */
/* Additive band-limited buzz: harmonics of f0 up to fmax, amp ~ 1/n^tilt. */
function harmonicBuzz(out, sr, t0, f0, fmax, tilt, envFn, amp, oddOnly){
  /* one band-limited cycle in a wavetable, then read it with linear interpolation (cheap for long sounds) */
  const N = 4096, tab = new Float32Array(N + 1), H = Math.floor(Math.min(fmax, sr * 0.45) / f0), r = rng(Math.round(f0 * 131));
  let norm = 0;
  for (let h = 1; h <= H; h++){
    if (oddOnly && h % 2 === 0) continue;
    const a = 1 / Math.pow(h, tilt), p = r() * TAU; norm += a;
    for (let i = 0; i < N; i++) tab[i] += a * Math.sin(TAU * h * i / N + p);
  }
  tab[N] = tab[0];
  const i0 = Math.round(t0 * sr), n = out.length - i0, inc = f0 * N / sr, k = amp * 2.2 / norm;
  let ph = 0;
  for (let i = 0; i < n; i++){
    const e = envFn(i / sr);
    if (e !== 0){ const j = ph | 0, f = ph - j; out[i0 + i] += k * e * (tab[j] + (tab[j + 1] - tab[j]) * f); }
    ph += inc; if (ph >= N) ph -= N;
  }
}
function adsr(a, d, tot){ return t => t < a ? t / a : t < tot - d ? 1 : t < tot ? (tot - t) / d : 0; }

/* Floppy drive motor whir at speed, length `dur`. */
function addMotor(out, sr, r, t0, dur, amp){
  const i0 = Math.round(t0 * sr), n = Math.min(out.length - i0, Math.round(dur * sr));
  const bp = biquad('bp', 400, 3, sr), bp2 = biquad('bp', 1300, 6, sr);
  let ph = 0, ph2 = 0;
  for (let i = 0; i < n; i++){
    const t = i / sr;
    ph += TAU * 50 / sr; ph2 += TAU * 5 / sr;
    const flutter = 1 + 0.18 * Math.sin(ph2);
    const env = Math.min(1, t / 0.08) * Math.min(1, (dur - t) / 0.25);
    const nz = r() * 2 - 1;
    out[i0 + i] += amp * env * flutter * (bp(nz) * 0.9 + bp2(nz) * 0.25 + Math.sin(ph) * 0.12);
  }
}
function synthDisk(sr, seed){
  const r = rng(seed), dur = 0.75 + r() * 0.25, out = new Float32Array(Math.round(dur * sr));
  addMotor(out, sr, r, 0, dur, 0.12);
  /* head-load solenoid clunk */
  burst(out, sr, r, 0.01, 0.002, 'bp', 700, 1.6, 0.55);
  ring(out, sr, 0.01, 150, 0.012, 0.3);
  /* stepper chatter: one or two seek bursts of rapid steps, then the settle tick */
  let t = 0.07 + r() * 0.04;
  const groups = 1 + (r() < 0.6 ? 1 : 0);
  for (let g = 0; g < groups; g++){
    const steps = 6 + Math.floor(r() * 16), rate = 0.0045 + r() * 0.0025, f = 1050 + r() * 350;
    for (let s = 0; s < steps; s++){
      ring(out, sr, t, f * (0.97 + r() * 0.06), 0.0022, 0.32);
      ring(out, sr, t, 420 + r() * 60, 0.003, 0.22);
      burst(out, sr, r, t, 0.0003, 'bp', 2600, 1.5, 0.18);
      t += rate * (0.92 + r() * 0.16);
    }
    ring(out, sr, t + 0.002, 330, 0.008, 0.25);         // head settles
    t += 0.06 + r() * 0.12;
  }
  /* data read: a faint fluttery rasp while the head sits on the track */
  burst(out, sr, r, Math.min(t, dur - 0.2), 0.08, 'bp', 1800, 4, 0.03, 0.15);
  return finish(onePoleLP(out, sr, 8000), sr, 0.8, 30);
}
function synthBeep(sr){
  /* a soft terminal bell: a small speaker squawking a near-square tone, rounded off */
  const dur = 0.16, out = new Float32Array(Math.round((dur + 0.06) * sr));
  harmonicBuzz(out, sr, 0, 784, 5000, 1.15, adsr(0.004, 0.045, dur), 1, true);
  const lp = biquad('lp', 2600, 0.9, sr), res = biquad('bp', 1600, 3, sr);
  for (let i = 0; i < out.length; i++){ const x = out[i]; out[i] = lp(x) + 0.25 * res(x); }
  return finish(out, sr, 0.9, 20);
}
function synthError(sr){
  /* low, short buzz with a little roughness */
  const dur = 0.2, out = new Float32Array(Math.round((dur + 0.05) * sr));
  harmonicBuzz(out, sr, 0, 98, 2400, 1.0, t => adsr(0.006, 0.05, dur)(t) * (0.85 + 0.15 * Math.sin(TAU * 31 * t)), 1);
  const lp = biquad('lp', 1100, 0.8, sr);
  for (let i = 0; i < out.length; i++) out[i] = lp(out[i]);
  return finish(out, sr, 0.9, 20);
}
function reverbIR(ctx){
  const sr = ctx.sampleRate, len = Math.round(0.75 * sr), buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++){
    const r = rng(77 + ch * 13), d = buf.getChannelData(ch);
    const pre = Math.round(0.006 * sr);
    let y;
    /* small room: early reflections, then a damped (darkening) diffuse tail, RT60 ~ 0.55 s */
    const er = [0.007, 0.011, 0.016, 0.023, 0.029, 0.037];
    for (let k = 0; k < er.length; k++){ const i = Math.round((er[k] + ch * 0.0013 * (k % 3)) * sr); d[i] += (r() < 0.5 ? -1 : 1) * 0.55 * Math.pow(0.8, k); }
    y = 0;
    for (let i = pre; i < len; i++){
      const t = (i - pre) / sr;
      const a = Math.exp(-TAU * (2200 + 6000 * Math.exp(-t / 0.12)) / sr);
      y = (r() * 2 - 1) * (1 - a) + a * y;
      const env = Math.exp(-t / 0.08) * Math.min(1, t / 0.004);
      d[i] += y * env * 2.2;
      if (len - i < 400) d[i] *= (len - i) / 400;
    }
  }
  return buf;
}

/* ---------------- recorded keys: one MP3 sprite, decoded once ---------------- */
/* The decoded sprite starts with a short sync blip; finding its leading edge measures the decoder's start padding
   (it differs between browsers), so every clip is cut at the right sample. */
let keyBufs = null, decoding = null;
function sliceKeys(buf, S, ctx){
  const sr = buf.sampleRate, x = buf.getChannelData(0), lim = Math.min(x.length, Math.round(0.25 * sr));
  let i = 0; while (i < lim && Math.abs(x[i]) <= 0.2) i++;
  const shift = i < lim ? i / sr - S.mark : 0;
  const cut = ([t, len]) => {
    const a = clamp(Math.round((t + shift) * sr), 0, x.length - 1), n = Math.max(1, Math.min(Math.round(len * sr), x.length - a));
    const b = ctx.createBuffer(1, n, sr); b.getChannelData(0).set(x.subarray(a, a + n)); return b;
  };
  const set = c => c && { d: c.d.map(cut), u: c.u.map(cut) };
  const C = S.clips, normal = set(C.normal), big = set(C.enter) || normal;
  return { normal, soft: normal, heavy: big, space: set(C.space) || normal, backspace: set(C.backspace) || big };
}
function decodeKeys(ctx){
  const S = M.KEY_SAMPLES;
  if (decoding || !S || !S.mp3 || !S.clips || !S.clips.normal) return;
  const bin = atob(S.mp3), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  decoding = new Promise((ok, no) => { const p = ctx.decodeAudioData(bytes.buffer, ok, no); if (p && p.catch) p.catch(no); })
    .then(buf => { keyBufs = sliceKeys(buf, S, ctx); flushPending(); }, () => {});   // undecodable: keys stay silent
}
/* decode ahead of the first gesture (an offline context needs no permission), so the first keystroke has its buffer */
{ const O = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (O) setTimeout(() => { try { decodeKeys(new O(1, 1, 44100)); } catch (e){} }, 0); }

/* ---------------- key mapping ---------------- */
const ROWS = [
  ['Backquote', 'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7', 'Digit8', 'Digit9', 'Digit0', 'Minus', 'Equal', 'Backspace'],
  ['Tab', 'KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT', 'KeyY', 'KeyU', 'KeyI', 'KeyO', 'KeyP', 'BracketLeft', 'BracketRight', 'Backslash'],
  ['CapsLock', 'KeyA', 'KeyS', 'KeyD', 'KeyF', 'KeyG', 'KeyH', 'KeyJ', 'KeyK', 'KeyL', 'Semicolon', 'Quote', 'Enter'],
  ['ShiftLeft', 'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyN', 'KeyM', 'Comma', 'Period', 'Slash', 'ShiftRight'],
];
const KEYX = { Space: 0.5, ArrowLeft: 0.85, ArrowDown: 0.9, ArrowRight: 0.95, ArrowUp: 0.9, ControlLeft: 0.05, AltLeft: 0.15, MetaLeft: 0.1, ControlRight: 0.85, AltRight: 0.75, MetaRight: 0.8, Escape: 0.02 };
ROWS.forEach(row => row.forEach((c, i) => { KEYX[c] = i / (row.length - 1); }));
function keyClass(code){
  if (code === 'Space') return 'space';
  if (code === 'Enter' || code === 'NumpadEnter' || code === 'Backspace') return 'heavy';
  if (/^(Shift|Control|Alt|Meta|CapsLock|Fn|OS)/.test(code)) return 'soft';
  return 'normal';
}
const keyInfo = {};
function infoFor(code){
  let k = keyInfo[code]; if (k) return k;
  const r = rng(hash(code || 'x'));
  const x = KEYX[code] != null ? KEYX[code] : 0.3 + r() * 0.4;
  k = keyInfo[code] = {
    cls: keyClass(code),
    rate: 0.955 + r() * 0.09,                 // per-key pitch
    gain: 0.86 + r() * 0.22,                  // per-key level
    bright: 7000 + r() * 4000,                // per-key cap/filter character
    pan: (x - 0.5) * 0.5,
    pool: Math.floor(r() * 1000),             // which slice of the variant pool this key leans on
    last: -1,
  };
  return k;
}
/* playback levels and pitch per key class */
const SAMPLED = {
  normal: { down: 0.75, up: 0.68, rate: 1.0 },
  soft:   { down: 0.58, up: 0.52, rate: 0.98 },
  heavy:  { down: 0.82, up: 0.75, rate: 1.0 },
  space:  { down: 0.82, up: 0.75, rate: 1.0 },
};

/* ---------------- engine ---------------- */
function Engine(ctx){
  const sr = ctx.sampleRate, E = this;
  const mk = (arr) => { const b = ctx.createBuffer(1, arr.length, sr); b.getChannelData(0).set(arr); return b; };
  E.ctx = ctx;

  /* master bus */
  E.out = ctx.createGain(); E.out.gain.value = 1;              // mute stage
  const glue = ctx.createDynamicsCompressor();
  glue.threshold.value = -20; glue.knee.value = 12; glue.ratio.value = 3; glue.attack.value = 0.004; glue.release.value = 0.18;
  const lim = ctx.createDynamicsCompressor();
  lim.threshold.value = -4; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.08;
  const tone = ctx.createBiquadFilter(); tone.type = 'highshelf'; tone.frequency.value = 7000; tone.gain.value = -3;  // never harsh
  const hpf = ctx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 25; hpf.Q.value = 0.7;
  E.master = ctx.createGain(); E.master.gain.value = 0.8;
  E.master.connect(hpf); hpf.connect(tone); tone.connect(glue); glue.connect(lim); lim.connect(E.out); E.out.connect(ctx.destination);

  /* room reverb send */
  E.verb = ctx.createConvolver(); E.verb.buffer = reverbIR(ctx);
  const verbRet = ctx.createGain(); verbRet.gain.value = 0.32;
  const verbLP = ctx.createBiquadFilter(); verbLP.type = 'lowpass'; verbLP.frequency.value = 5500;
  E.verb.connect(verbLP); verbLP.connect(verbRet); verbRet.connect(E.master);

  E.keyBus = ctx.createGain(); E.keyBus.gain.value = 0.85; E.keyBus.connect(E.master);
  const keySend = ctx.createGain(); keySend.gain.value = 0.5; E.keyBus.connect(keySend); keySend.connect(E.verb);
  E.fxBus = ctx.createGain(); E.fxBus.gain.value = 1; E.fxBus.connect(E.master);
  const fxSend = ctx.createGain(); fxSend.gain.value = 0.35; E.fxBus.connect(fxSend); fxSend.connect(E.verb);

  /* event buffers are built lazily (or by warm()), so unlock stays light */
  const FX = {
    beep: () => [mk(synthBeep(sr))],
    error: () => [mk(synthError(sr))],
    disk: () => [0, 1, 2, 3].map(i => mk(synthDisk(sr, 300 + i * 17))),
  };
  const cache = {};
  E.getFx = name => cache[name] || (FX[name] ? (cache[name] = FX[name]()) : null);
  E.warm = () => { for (const n in FX) E.getFx(n); };
  E.voices = 0;
}
Engine.prototype.play = function (buf, bus, when, gain, rate, pan, lpF){
  const ctx = this.ctx;
  if (this.voices > 40) return;
  const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate || 1;
  const g = ctx.createGain(); g.gain.value = gain;
  let node = src;
  if (lpF){ const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lpF; f.Q.value = 0.5; node.connect(f); node = f; }
  node.connect(g); node = g;
  if (pan && ctx.createStereoPanner){ const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); node.connect(p); node = p; }
  node.connect(bus);
  this.voices++;
  src.onended = () => { this.voices--; try { node.disconnect(); } catch (e){} };
  src.start(when);
  return src;
};
Engine.prototype.key = function (code, down, when){
  const k = infoFor(code), pool = (code === 'Backspace' && keyBufs.backspace) || keyBufs[k.cls], list = down ? pool.d : pool.u;
  /* each key leans on 3 neighbouring variants of its pool, plus an occasional wildcard; never the same twice in a row */
  let idx;
  for (let tries = 0; tries < 4; tries++){
    idx = Math.random() < 0.8 ? (k.pool + Math.floor(Math.random() * 3)) % list.length : Math.floor(Math.random() * list.length);
    if (idx !== (down ? k.last : k.lastU)) break;
  }
  if (down) k.last = idx; else k.lastU = idx;
  const sm = SAMPLED[k.cls];
  const level = (down ? sm.down : sm.up) * k.gain * (0.88 + Math.random() * 0.24);
  const rate = k.rate * sm.rate * (0.985 + Math.random() * 0.03);
  this.play(list[idx], this.keyBus, when, level, rate, k.pan + (Math.random() - 0.5) * 0.04, k.bright * (0.92 + Math.random() * 0.16));
};
Engine.prototype.event = function (name, when){
  const L = this.getFx(name); if (!L) return;
  const buf = L[Math.floor(Math.random() * L.length)];
  const lvl = name === 'beep' ? 0.085 : name === 'error' ? 0.15 : 0.26;
  this.play(buf, this.fxBus, when, lvl, name === 'disk' ? 0.97 + Math.random() * 0.06 : 1, name === 'disk' ? 0.25 : 0);
};

/* ---------------- public API ---------------- */
let eng = null, booted = false, muted = false, hidden = false, unlockedAt = 0;
try { muted = localStorage.getItem(LS_KEY) === '1'; } catch (e){}

function ready(){
  if (!eng) return false;
  const ctx = eng.ctx;
  /* the first keystroke usually lands while resume() is still in flight: schedule it anyway. A suspended context's
     clock is frozen, so the hit plays the instant the context starts rather than being dropped. */
  if (ctx.state !== 'running'){ if (!muted && !hidden && ctx.state === 'suspended'){ ctx.resume().catch(() => {}); return unlockedAt > 0 && performance.now() - unlockedAt < 1500; } return false; }
  return !muted;
}
/* keys pressed while the sprite is still decoding play the moment it is ready (if that is soon enough to still feel right) */
const pending = [];
function flushPending(){
  const now = performance.now();
  for (const [code, down, t] of pending.splice(0)) if (now - t < 300) sound.key(code, down);
}

const sound = {
  get muted(){ return muted; },
  unlock(){
    try {
      if (!eng){
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        const ctx = new AC({ latencyHint: 'interactive' });
        eng = new Engine(ctx);
        eng.out.gain.value = muted ? 0 : 1;
        decodeKeys(ctx);                     // only if the early offline decode was not possible
      }
      if (!unlockedAt) unlockedAt = performance.now();
      const ctx = eng.ctx, go = () => {
        if (booted) return; booted = true;
        setTimeout(() => { try { eng.warm(); } catch (e){} }, 2600);   // build the event sounds before they are needed
      };
      if (ctx.state === 'running') go();
      else if (!hidden){ const p = ctx.resume(); if (p && p.then) p.then(go, () => {}); else go(); }
    } catch (e){ /* audio is a nicety; never break the page */ }
  },
  key(code, down){
    if (!ready()) return;
    if (!keyBufs){ if (decoding && pending.length < 6) pending.push([code, down, performance.now()]); return; }
    try { eng.key(String(code || ''), !!down, eng.ctx.currentTime); } catch (e){}
  },
  event(name){
    if (!ready()) return;
    try { eng.event(name, eng.ctx.currentTime + 0.005); } catch (e){}
  },
  setMuted(m){
    muted = !!m;
    try { localStorage.setItem(LS_KEY, muted ? '1' : '0'); } catch (e){}
    if (!eng) return;
    const ctx = eng.ctx, g = eng.out.gain, now = ctx.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.setTargetAtTime(muted ? 0 : 1, now, 0.04);
    if (!muted && !hidden && ctx.state === 'suspended') ctx.resume().catch(() => {});
  },
  update(){},                                // nothing ambient runs; kept for the contract
};

document.addEventListener('visibilitychange', () => {
  hidden = document.visibilityState === 'hidden';
  if (!eng) return;
  try { if (hidden) eng.ctx.suspend(); else if (!muted && booted) eng.ctx.resume(); } catch (e){}
});

M.sound = sound;
})();

</script>
<script>
/* scene.js: the room, the machine, the keyboard and the light. Implements MAC.createScene (see CONTRACT.md).
   Units are metres. The desk top is at y = 0.75; the typist faces -z; the wall is behind the computer.
   Everything procedural is built once at start-up: no image files, no addons. */
(() => {
'use strict';
const M = window.MAC = window.MAC || {};
if (typeof THREE === 'undefined') return;   // three.js did not load: main.js shows the flat terminal instead

/* Phosphor: soft green, a desaturated, slightly minty P1. Amber would melt into the room, because the only other
   light is a 2700K lamp. Green sits opposite it on the colour wheel, so the tube separates from the room and the
   typist gets a two-tone key and fill: warm lamp from the left, cool green screen from the front. P1 green is also
   the brightest-feeling phosphor for small text, which keeps the terminal readable. */
const PHOSPHOR = [0.60, 1.00, 0.70];

const V3 = THREE.Vector3;
const DESK_Y = 0.75;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;

/* ---------- noise ---------- */
const PERM = (() => { const p = new Uint8Array(512), a = []; let s = 1337;
  for (let i = 0; i < 256; i++) a.push(i);
  for (let i = 255; i > 0; i--){ s = (s * 16807) % 2147483647; const j = s % (i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = a[i & 255]; return p; })();
const hash = (i, j) => PERM[(PERM[i & 255] + j) & 255] / 255;
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;

/* ---------- canvas textures ---------- */

function paint(w, h, f, withHeight){
  const [c, x] = cnv(w, h), img = x.createImageData(w, h), d = img.data;
  let hc, hx, himg, hd;
  if (withHeight){ [hc, hx] = cnv(w, h); himg = hx.createImageData(w, h); hd = himg.data; }
  const o = [0, 0, 0, .5];
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++){
    o[3] = .5; f(i / (w - 1), 1 - j / (h - 1), o); const k = (j * w + i) * 4;
    d[k] = clamp(o[0], 0, 1) * 255; d[k + 1] = clamp(o[1], 0, 1) * 255; d[k + 2] = clamp(o[2], 0, 1) * 255; d[k + 3] = 255;
    if (hd){ const g = clamp(o[3], 0, 1) * 255; hd[k] = hd[k + 1] = hd[k + 2] = g; hd[k + 3] = 255; }
  }

/* signed distance to a rounded rectangle centred at the origin */
function sdRR(x, y, hw, hh, r){ const qx = Math.abs(x) - hw + r, qy = Math.abs(y) - hh + r;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r; }

/* Rounded box with k arc segments per edge and m interior segments per axis. Face-aware UVs are proportional to
   position (so painted textures line up with deformations), and deform(v, face, u, v) can sculpt it. */
function roundedBox(w, h, d, r, k, m = [1, 1, 1], deform){
  const g = new THREE.BoxGeometry(w, h, d, 2 * k + m[0], 2 * k + m[1], 2 * k + m[2]);
  const P = g.attributes.position, N = g.attributes.normal, UV = g.attributes.uv, n = P.count;
  const H = [w / 2, h / 2, d / 2], face = new Int8Array(n), v = new V3(), inner = new V3(), dl = new V3();
  const remap = (c, ax) => { const hh = H[ax], segs = 2 * k + m[ax], i = Math.round((c + hh) / (2 * hh) * segs);
    if (i <= k) return -hh + r * i / k; if (i >= segs - k) return hh - r * (segs - i) / k; return -hh + r + (2 * hh - 2 * r) * (i - k) / m[ax]; };
  for (let i = 0; i < n; i++){
    const nx = N.getX(i), ny = N.getY(i), nz = N.getZ(i);
    const f = nx > .5 ? 0 : nx < -.5 ? 1 : ny > .5 ? 2 : ny < -.5 ? 3 : nz > .5 ? 4 : 5; face[i] = f;
    const x = remap(P.getX(i), 0), y = remap(P.getY(i), 1), z = remap(P.getZ(i), 2);
    let u, vv;
    switch (f){
      case 0: u = (H[2] - z) / d; vv = (y + H[1]) / h; break;
      case 1: u = (z + H[2]) / d; vv = (y + H[1]) / h; break;
      case 2: u = (x + H[0]) / w; vv = (H[2] - z) / d; break;
      case 3: u = (x + H[0]) / w; vv = (z + H[2]) / d; break;
      case 4: u = (x + H[0]) / w; vv = (y + H[1]) / h; break;
      default: u = (H[0] - x) / w; vv = (y + H[1]) / h;
    }
    UV.setXY(i, u, vv);
    v.set(x, y, z); inner.set(clamp(x, -H[0] + r, H[0] - r), clamp(y, -H[1] + r, H[1] - r), clamp(z, -H[2] + r, H[2] - r));
    dl.subVectors(v, inner); if (dl.lengthSq() > 1e-14) v.copy(inner).addScaledVector(dl.normalize(), r);
    if (deform) deform(v, f, u, vv);
    P.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals(); weldNormals(g); g.userData.face = face; return g;
}
/* average normals of coincident vertices so the six faces of a rounded box shade as one surface */
function weldNormals(g){
  const P = g.attributes.position, N = g.attributes.normal, map = new Map(), keys = new Array(P.count);
  for (let i = 0; i < P.count; i++){
    const k = Math.round(P.getX(i) * 1e5) + '_' + Math.round(P.getY(i) * 1e5) + '_' + Math.round(P.getZ(i) * 1e5); keys[i] = k;
    let a = map.get(k); if (!a){ a = [0, 0, 0]; map.set(k, a); } a[0] += N.getX(i); a[1] += N.getY(i); a[2] += N.getZ(i);
  }
  for (let i = 0; i < P.count; i++){ const a = map.get(keys[i]), l = Math.hypot(a[0], a[1], a[2]) || 1; N.setXYZ(i, a[0] / l, a[1] / l, a[2] / l); }
}
function mesh(geo, mat, shadow = true, recv = true){ const m = new THREE.Mesh(geo, mat); m.castShadow = shadow; m.receiveShadow = recv; return m; }
function rod(a, b, r, mat, seg = 8){ const d = new V3().subVectors(b, a), L = d.length();
  const m = mesh(new THREE.CylinderGeometry(r, r, L, seg), mat); m.position.copy(a).addScaledVector(d, .5);

M.createScene = function createScene(container){

    // ---- textures (front, side, top, back) ----
    const FW = 512, FH = Math.round(512 * CH / CW);
    const [frontC, frontH] = paint(FW, FH, (u, v, o) => {
      plasticBase(u, v, o, 1, CH / CW);

      // ventilation grille strip under the chin lines
      if (y < -.135 && y > -.152 && Math.abs(x) < .055 && Math.abs(x) > .02){ const p = ((x + 1) * 1000 / 3.2) % 1; if (p < .45){ o[3] -= .35; grime(o, .3); } }
    }, true);
    const sideFn = (mirror) => (u, v, o) => {
      plasticBase(mirror ? 1 - u : u, v, o, CD / CW, CH / CW);
      const z = u * CD, y = v * CH; // z from the front edge, y from the bottom
      // vent slits toward the rear and top of each side

        if (p < .38 && w > 0){ o[3] -= .45 * w; grime(o, .35 * w); } else if (p < .5 && w > 0) o[3] += .08 * w; }

    const [topC, topH] = paint(256, Math.round(256 * CD / CW), (u, v, o) => {
      plasticBase(u, v, o, 1, CD / CW);

      // rear carry handle: a deep moulded recess along the back of the top
      const hs = sdRR(x, z - .035, .062, .014, .012);
      if (hs < .002){ const t = sstep(.002, -.008, hs); o[3] -= .5 * t; grime(o, .1 + .4 * t); }
      // top vents
      if (z > .065 && z < .12 && Math.abs(x) < .085){ const p = ((x + 1) * 1000 / 6) % 1; if (p < .4){ o[3] -= .4; grime(o, .38); } }

    }, true);
    const backC = paint(128, 128, (u, v, o) => { plasticBase(u, v, o, 1, 1); grime(o, .08); });

      if (f === 4){ const sd = sdRR(p.x, p.y - BZ.y, BZ.hw, BZ.hh, BZ.r); if (sd < 0) p.z -= BZ.depth * sstep(0, -BZ.wall, sd); }

      const t = clamp(-p.z / (CD / 2), 0, 1); // taper toward the back

    });

    // moulded bezel lip: a soft raised rim around the tube recess, its profile rounded by a multi-step bevel
    const backT = T(backC); backT.wrapS = backT.wrapT = THREE.RepeatWrapping;
    const lipM = plasticMat(backT, null, { roughness: .5 });
    const frameGeo = (ohw, ohh, or, ihw, ihh, ir, depth, bt, bs, segs) => {
      const sh = rrShape(ohw, ohh, or); sh.holes.push(rrShape(ihw, ihh, ir));
      const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: bt, bevelSize: bs, bevelSegments: segs, curveSegments: 10 });
      const UV = g.attributes.uv; for (let i = 0; i < UV.count; i++) UV.setXY(i, UV.getX(i) * 4, UV.getY(i) * 4);
      return g; };
    {
      const lip = mesh(frameGeo(BZ.hw + .0075, BZ.hh + .0075, BZ.r + .0075, BZ.hw + .002, BZ.hh + .002, BZ.r + .002, .0006, .0017, .0019, 5), lipM);
      const z = faceZ(BZ.y); lip.position.set(0, BZ.y, z - .0006); lip.rotation.x = -Math.atan(SLOPE); computer.add(lip);

      mouth.position.set(SLOT.x, SLOT.y, faceZ(SLOT.y) - .0004); mouth.rotation.x = -Math.atan(SLOPE); computer.add(mouth);
      // throat walls in shadow, so the opening reads as a slot rather than a sticker

      throat.position.set(SLOT.x, SLOT.y, faceZ(SLOT.y) + .0006); throat.rotation.x = -Math.atan(SLOPE); computer.add(throat);
      const door = mesh(new THREE.PlaneGeometry(SLOT.hw * 2 - .002, SLOT.hh * 2 - .0004), new THREE.MeshStandardMaterial({ color: lin(0x2a2722), roughness: .55, metalness: .3 }), false);
      door.position.set(SLOT.x, SLOT.y + .0002, faceZ(SLOT.y) + .0009); door.rotation.x = -Math.atan(SLOPE) - .18; computer.add(door);
      const eject = mesh(roundedBox(.011, .0042, .004, .0012, 2), lipM);
      eject.position.set(SLOT.x + SLOT.hw - .008, SLOT.y - SLOT.hh - .0095, faceZ(SLOT.y - .0095) + .0009); eject.rotation.x = -Math.atan(SLOPE); computer.add(eject);
      // drive activity lamp, unlit: a tiny dome of dark red lens
      const led = mesh(new THREE.SphereGeometry(.0018, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: lin(0x3a0a06), roughness: .2, clearcoat: 1 }), false);
      led.rotation.x = Math.PI / 2 - Math.atan(SLOPE); led.position.set(SLOT.x - SLOT.hw - .01, SLOT.y, faceZ(SLOT.y)); computer.add(led);
    }

    const sg = new THREE.ShapeGeometry(rrShape(SLOT.hw, SLOT.hh, SLOT.hh * .95), 6);
    const slot = mesh(sg, dark, false); slot.position.set(SLOT.x, SLOT.y, slotZ + .0004); slot.rotation.x = -Math.atan(SLOPE); computer.add(slot);

  eyeFull.x = (screenCenter.x + keyboardCenter.x) / 2;

    const ps = [], gx = new V3().crossVectors(new V3(0, 1, 0), flatN).normalize();
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) ps.push(screenCenter.clone().addScaledVector(gx, sx * (GW / 2 + .035)).add(new V3(0, sy * (GH / 2 + .035), 0)));

    // so the bezel and a margin of the case frame it all round

  /* the reveal: from black, the tube powers on (a bright line opens into the raster) while the lamp glows up and

  if (/[?&]debug\b/.test(location.search)) api._dbg = { yawS, pitchS, intro, shot, LOOK, lampS };
  api.resize(container.clientWidth || innerWidth, container.clientHeight || innerHeight);

};
})();

      const fwd = kfw.clone().addScaledVector(lat, H.h ? -.17 : .17).normalize().addScaledVector(n, .2).normalize();   // turned in a little, in line with the forearm

  function findLamp(){

  const C = (opts && opts.content) || M.CONTENT || {};
  if (opts && opts.cols >= 32) COLS = opts.cols | 0;
  const aspect = opts && opts.aspect > 0.3 && opts.aspect < 3 ? opts.aspect : 4 / 3;
  const W = WIDTH, H = Math.round(WIDTH / aspect);
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d', { alpha: false });
  /* VT323 has an fi/fl ligature that would eat a grid cell: switch shaping extras off where the canvas allows,
     and (see noLig) break the pair with a zero-width non-joiner everywhere else */
  const noShaping = () => { try { g.fontKerning = 'none'; g.textRendering = 'optimizeSpeed'; if ('fontVariantLigatures' in g) g.fontVariantLigatures = 'none'; } catch (e){} };
  noShaping();
  const fillT = (t, x, y) => g.fillText(noLig(t), x, y);
  const REDUCED = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P = PALETTE;
  const sfx = name => { try { if (M.sound && M.sound.event) M.sound.event(name); } catch (e){} };
  let lastDisk = 0;
  const diskSound = () => { const t = performance.now(); if (t - lastDisk > 400){ lastDisk = t; sfx('disk'); } };

  /* ---- grid ---- */
  const PADX = 52, cw = (W - 2 * PADX) / COLS;
  let fs = cw / 0.4;                                    // VT323 advance is 0.4em; re-measured once loaded
  const ch = Math.round(fs * LINE);
  const ROWS = Math.floor((H - 64) / ch);
  const PADY = Math.round((H - ROWS * ch) / 2);
  const font = (k = 1) => (fs * k).toFixed(2) + 'px ' + FONT;
  /* g.font is only assigned when it changes: the strings are built once per size (a font set is parsed every time) */
  let fontStr = {}, curFont = '';
  const setFont = (k = 1) => { const f = fontStr[k] || (fontStr[k] = font(k)); if (f !== curFont){ g.font = f; curFont = f; } };
  const measureFont = () => { g.font = '100px ' + FONT; curFont = ''; const r = g.measureText('M').width / 100; if (r > 0.2 && r < 0.8){ fs = cw / r; fontStr = {}; } dirty = true; };

  let input = '', cur = 0;

  let booting = (() => { try { return !sessionStorage.getItem(BOOT_KEY); } catch (e){ return false; } })(), bootT = 0, bootLastDraw = -1;
  let now = 0, blinkT0 = 0, blinkOn = true, dirty = true;
  let animFps = 0, lastAnim = 0;
  let rate = RATE, rateRows = -1, rateShown = 0;   // the typing-out speed for what is pending (see update)
  let suggestion = '';                 // "did you mean" target, shown as ghost on an empty prompt
  let tabState = null;
  let ahead = '';           // keys typed while a command runs, waiting for the next prompt ('\n' = a queued Enter)
  let okRuns = 0;           // commands that worked this visit
  let nudgeOff = false, lastNudge = false, idleT0 = -1;   // the first-visit nudge under the prompt: after ~8s idle, until something works
  let runQueued = false;    // a whole line came in with the type-ahead: run it on the next frame
  let rs = null;            // ctrl+r search: { q, i, draft, dcur }
  let history = [];
  try { const h = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); if (Array.isArray(h)) history = h.filter(s => typeof s === 'string').slice(-200); } catch (e){}
  let hIdx = history.length, hDraft = '', hPrefix = '';
  const fresh = !history.length;     // a first-time visitor (nothing typed here before)
  let ran = 0;
  let job = null;                      // the running command line, if any
  let app = null;                      // the full-screen app, if any
  let openRow = null;                  // the output row still being written to
  let status = 0;

  /* ---- shell state ---- */
  const FS = createFS(() => cwd, diskSound);
  let cwd = HOME;
  const ENV = { HOME, USER: 'kaiav', LOGNAME: 'kaiav', HOSTNAME: 'kn84', SHELL: '/bin/sh', TERM: 'vt320', PATH: '/bin:/usr/bin:/usr/games',
    PWD: HOME, LANG: 'en_US.UTF-8', COLUMNS: String(COLS), LINES: String(ROWS) };
  const ALIAS_KEY = 'kaiav.term.alias';
  let ALIASES = { ll: 'ls -l', la: 'ls -a', l: 'ls', dir: 'ls', cls: 'clear', less: 'cat', more: 'cat', quit: 'exit', logout: 'exit', '?': 'help', home: 'welcome' };
  try { const a = JSON.parse(localStorage.getItem(ALIAS_KEY) || 'null'); if (a && typeof a === 'object') ALIASES = Object.assign(Object.create(null), a); } catch (e){}
  const saveAliases = () => { try { localStorage.setItem(ALIAS_KEY, JSON.stringify(ALIASES)); } catch (e){} };
  const hasAlias = n => Object.prototype.hasOwnProperty.call(ALIASES, n);
  function setCwd(p){ ENV.OLDPWD = cwd; cwd = p; ENV.PWD = p; }
  const tildify = p => p === HOME ? '~' : p.startsWith(HOME + '/') ? '~' + p.slice(HOME.length) : p;

  /* ---- output builder (rich rows) ---- */
  function out(){
    const r = [], o = {
      rows: r,
      line(...spans){ const s = spans.map(x => typeof x === 'string' ? [x, 'n'] : x); r.push({ k: 't', i: 2, s }); return o; },
      at(i, ...spans){ o.line(...spans); r[r.length - 1].i = i; return o; },
      blank(){ r.push({ k: 't', i: 0, s: [] }); return o; },
      big(text, st = 'b'){ r.push({ k: 'big', i: 2, s: [[text, st]] }); return o; },
      head(label, note){ r.push({ k: 'head', i: 2, label, note: note || '' }); return o; },
      para(text, st = 'n', width = COLS - 6, i = 2){ for (const l of wrap(text, width)) o.at(i, [l, st]); return o; },
      /* a square bitmap (true = dark), dark on a lit field with a quiet zone of q modules: QR codes.
         Drawn as vectors so a module is square whatever the cell shape. */
      bits(m, q = 2){
        const n = m.length + 2 * q, availW = X(COLS - 2) - X(2), availH = (ROWS - 4) * ch;
        const sz = Math.max(2, Math.floor(Math.min(availW / n, availH / n, cw * 1.2)));
        const h = Math.ceil(n * sz / ch);
        r.push({ k: 'viz', h, live: null, t0: -1, draw(x, y){
          const x0 = Math.round(x), y0 = Math.round(y + (h * ch - n * sz) / 2);
          g.fillStyle = P.bright; g.fillRect(x0, y0, n * sz, n * sz);
          g.fillStyle = P.bg;
          for (let yy = 0; yy < m.length; yy++) for (let xx = 0; xx < m.length; xx++) if (m[yy][xx]) g.fillRect(x0 + (xx + q) * sz, y0 + (yy + q) * sz, sz, sz);
        } });
        return o;
      },
      /* a boxed panel: title in the top border, label/value rows, rows that open or copy (click, tap, or the
         arrows then enter), and a footer line while it can still be chosen from */
      card(spec){ const c = makeCard(spec); r.push(c); o.lastCard = c; return o; },
      /* groups of spans laid out left to right with a gap, wrapping at the grid width */
      flow(groups, gap = '  ', i = 2){
        let line = [], w = 0;
        for (const gr of groups){
          const gw = gr.reduce((a, x) => a + x[0].length, 0);
          if (line.length && w + gap.length + gw > COLS - i){ o.at(i, ...line); line = []; w = 0; }
          if (line.length){ line.push([gap, 'f']); w += gap.length; }
          line.push(...gr); w += gw;
        }
        if (line.length) o.at(i, ...line);
        return o;
      },
      link(label, url, i = 2, labelW = 0, shown){
        const sp = []; if (label) sp.push([pad(label, labelW), 'd']);
        sp.push([shown || url, 'n', { url }]); r.push({ k: 't', i, s: sp }); return o;
      },
    };
    return o;
  }
  const heightOf = r => r.k === 'big' ? 2 : r.k === 'card' ? r.body + (r.foot ? 3 : 2) : r.k === 'viz' ? r.h : 1;
  const lenOf = r => r.k === 't' ? r.s.reduce((n, s) => n + s[0].length, 0) + (r.i || 0) : r.k === 'big' ? r.s[0][0].length : r.k === 'head' ? r.label.length * 2 : 0;
  const costOf = r => r.k === 'viz' || r.k === 'card' ? 40 : r.k === 'big' ? lenOf(r) * 2 + 4 : r.k === 'head' ? 30 : Math.max(3, lenOf(r) - (r.i || 0));
  const plainOf = r => r.k === 't' || r.k === 'big' ? r.s.map(s => s[1] === 'f' ? ' ' : s[0]).join('').replace(/\s+/g, ' ').trim()
    : r.k === 'card' ? r.title + '. ' + r.items.map(it => (it.ai >= 0 ? (it.ai + 1) + ', ' : '') + it.label + ': ' + (it.full || it.value)).join('. ') : '';
  const textOf = r => r.k === 't' ? (' '.repeat(r.i || 0) + r.s.map(s => s[0]).join('')).replace(/\s+$/, '') : r.k === 'big' ? '  ' + r.s[0][0] : r.k === 'head' ? '  ' + r.label.toUpperCase()
    : r.k === 'card' ? r.items.map(it => pad(it.label, r.lw) + (it.full || it.value)).join('\n') : null;
  function makeCard(spec){
    const items = spec.items.map(it => Object.assign({}, it));
    let ai = 0; for (const it of items) it.ai = it.url || it.copy || it.post ? ai++ : -1;
    const lw = Math.max(0, ...items.map(it => it.label.length)) + 2;
    const acts = items.filter(it => it.ai >= 0);
    const room = it => (COLS - 3) - (5 + lw) - (it.hint ? it.hint.length + 2 : 0);
    if (items.some(it => it.value.length > room(it))) for (const it of items) it.hint = '';   // values win over hints

    const stacked = COLS < 46 || items.some(it => it.value.length > room(it));
    const vroom = COLS - 8;
    let y = 0;
    for (const it of items){
      it.y = y;
      if (!stacked){ it.lines = [it.value]; it.n = 1; y++; continue; }
      const parts = []; let v = it.value;
      while (v.length > vroom){ let cut = Math.max(v.lastIndexOf('/', vroom - 1), v.lastIndexOf('.', vroom - 1), v.lastIndexOf('@', vroom - 1), v.lastIndexOf(' ', vroom)); if (cut < vroom / 2) cut = vroom - 1; parts.push(v.slice(0, cut + 1).trimEnd()); v = v.slice(cut + 1).trimStart(); }
      parts.push(v); it.sub0 = parts.length;

      it.lines = parts; it.n = 1 + parts.length; y += it.n;

  function pushRow(r){ openRow = null; rows.push(r); dirty = true; }

  function trim(){

    if (drop){ rows.splice(0, drop); shown = Math.max(0, shown - drop); if (shown === 0) partial = 0; }
  }
  /* the screen-reader mirror (#mirror, a live log): each command and its output are appended as short
     paragraphs, long output in sentence-sized chunks, and only the last few dozen are kept */
  function mirror(text, cmd){
    const m = document.getElementById('mirror'); if (!m) return;

      let cut = text.length;
      if (cut > 320){ cut = text.lastIndexOf('. ', 320); if (cut < 120) cut = text.lastIndexOf(' ', 320); if (cut < 120) cut = 320; else cut++; }

  }
  const typing = () => shown < rows.length;
  function revealAll(){ const t = now; for (let i = shown; i < rows.length; i++) if (rows[i].k === 'viz' && rows[i].t0 < 0) rows[i].t0 = t - (REDUCED ? 99 : 0); shown = rows.length; partial = 0; carry = 0; dirty = true; }

  /* ---- streams: the tty writes styled spans into rows; buffers collect text for pipes and files ---- */
  const STY = { normal: 'n', dim: 'd', bright: 'b', faint: 'f', accent: 'a', inverse: 'i', n: 'n', d: 'd', b: 'b', f: 'f', a: 'a', i: 'i' };

      dirty = true;
    },
    rich(o){
      openRow = null;
      for (const r of o.rows) rows.push(r);
      if (job) job.plain += o.rows.map(plainOf).filter(Boolean).join('. ') + ' ';
      dirty = true;
    },
  };
  function buffer(){
    const b = { tty: false, text: '',
      write(t){ b.text += clean(t); },
      rich(o){ b.text += o.rows.map(textOf).filter(x => x != null).join('\n') + '\n'; } };
    return b;
  }
  const NULLSINK = { tty: false, text: '', write(){}, rich(){} };
  /* error lines read the same everywhere: "name:" dim, the message normal, a trailing "(try: ...)" faint.
     Into a pipe or a file they are plain text. */
  function errLine(sink, t){

      if (l){

        while (at < l.length){

        }

  const wrapT = (t, w = 50) => wrap(t, w).join('\n');

  const TEXT = {
    about: () => [C.name, A.role, '', ...(A.body || []).map(p => wrapT(p))].filter(x => x != null).join('\n') + '\n',
    eden: () => [E.title || 'Eden', E.role, '', E.line, E.body ? '\n' + E.body : null].filter(x => x != null).join('\n') + '\n',

  const README = [
    '# README', '',
    'welcome to the KN-84, the small computer on ' + (C.name ? C.name + "'s" : 'this') + ' desk.',
    'it runs a little shell. everything here is safe to poke at.', '',
    '## things to try', '',

    '  eden        ' + (E.line || E.title || 'Eden'),

    '  contact     email addresses',

    '  weather     the sky where you are',

    { path: '/etc/motd', text: 'KN-84 personal computer. KNOS 1.04.\nType help to begin, or cat README.md for a short guide.\n' },

  ]);
  if (!FS.isDir(cwd)) cwd = '/';

  /* ---- documents ---- */
  function welcome(o){

      if (above){ gameOver(); return; }
      const full = [];
      for (let y = 0; y < BH; y++) if (board[y].every(Boolean)) full.push(y);
      if (full.length){
        score += LINE_PTS[full.length] * level;
        flash = { rows: full, t: 0 };
        sound(api, 'beep');
      } else next();
    }
    function finishClear(){
      for (const y of flash.rows){ board.splice(y, 1); board.unshift(Array(BW).fill(null)); }
      lines += flash.rows.length;
      level = 1 + Math.floor(lines / 10);
      flash = null;
      next();
    }
    function hardDrop(){ const g = ghostY(); score += (g - cur.y) * 2; cur.y = g; lock(); }
    function doHold(){
      if (!canHold) return;
      const p = cur.p;
      if (hold){ spawn(hold); } else next();
      hold = p; canHold = false;
    }
    function restart(){
      for (const row of board) row.fill(null);
      bag = []; queue = []; hold = null; score = 0; lines = 0; level = 1; over = false; newHi = false; paused = false; flash = null;
      next();
    }
    next();
    let oyDrawn = 0;                                         // where the well was last drawn (for taps)

    return {
      /* phones: the top of the screen turns, the bottom drops, the left and right thirds move */
      tap(col, row){
        help = false;
        if (over){ restart(); return true; }
        if (paused){ paused = false; return true; }
        if (!cur || flash) return true;
        const rows = api.rows || 23, cols = api.cols || 40;
        if (row < rows * 0.3) rotate(1);
        else if (row >= Math.min(rows * 0.75, oyDrawn + BH)) hardDrop();
        else if (col < cols / 3) shift(-1);
        else if (col >= cols * 2 / 3) shift(1);
        else rotate(1);
        return true;
      },
      key(e){
        const k = e.key;
        help = false;
        if (over){
          if (k === 'Enter' || k === 'r' || k === 'R') restart();
          else if (isQuit(k)) api.exit(0);
          return true;
        }
        if (isQuit(k)){ api.print(`tetris: score ${score}, ${lines} lines, level ${level}. high score ${Math.max(hi, score)}`); if (score > hi) hiSet(TETRIS_HI, score); api.exit(0); return true; }
        if (k === 'p' || k === 'P'){ paused = !paused; return true; }
        if (paused || !cur || flash) return true;
        switch (k){
          case 'ArrowLeft': shift(-1); break;
          case 'ArrowRight': shift(1); break;
          case 'ArrowDown': if (fits(cur.p, cur.r, cur.x, cur.y + 1)){ cur.y++; score += 1; fall = 0; } break;
          case 'ArrowUp': case 'x': case 'X': rotate(1); break;
          case 'z': case 'Z': case 'Control': rotate(-1); break;
          case ' ': hardDrop(); break;
          case 'c': case 'C': case 'Shift': doHold(); break;
          default: return true;
        }
        return true;
      },
      tick(dt){
        dt = Math.min(secs(dt), 0.1); t += dt;
        if (over || paused) return Math.floor(t * 2) !== Math.floor((t - dt) * 2);   // blink prompts
        if (flash){ flash.t += dt; if (flash.t > 0.36) finishClear(); return true; }
        if (!cur) return false;
        if (grounded()){
          lockT += dt;
          if (lockT >= 0.5) lock();
          return true;
        }
        fall += dt;
        const g = gravity(level);
        let dirty = false;
        while (fall >= g && cur && !grounded()){ fall -= g; cur.y++; lockT = 0; dirty = true; }
        return dirty;
      },
      render(scr){
        scr.clear(); scr.cursor(0, 0, null);
        const W = BW * 2 + 4;
        const compact = STACK || scr.cols < 64 || scr.rows < 22;      // one panel, beside the well or under it
        const ox = STACK ? Math.max(0, ((scr.cols - W) / 2) | 0) : compact ? Math.max(0, ((scr.cols - (W + 3 + 20)) / 2) | 0) : ((scr.cols - W) / 2) | 0;
        const oy = Math.max(0, ((scr.rows - BH - 2 - (STACK ? 13 : 0)) / 2) | 0); oyDrawn = oy;
        const bx = ox + 2;  // first board column
        // well: classic "<!" ... "!>" sides
        for (let y = 0; y < BH; y++){
          scr.put(ox, oy + y, '<!', 'faint'); scr.put(bx + BW * 2, oy + y, '!>', 'faint');
          scr.put(bx, oy + y, ' .'.repeat(BW), 'faint');
        }
        scr.put(ox, oy + BH, '<!' + '='.repeat(BW * 2) + '!>', 'faint');
        scr.put(bx, oy + BH + 1, '\\/'.repeat(BW), 'faint');
        // settled blocks (flashing rows alternate bright / blank)
        const flashOn = flash && Math.floor(flash.t / 0.06) % 2 === 0;
        for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++){
          const c = board[y][x]; if (!c) continue;
          if (flash && flash.rows.includes(y)){ if (flashOn) scr.put(bx + x * 2, oy + y, '  ', blk('bright')); else scr.put(bx + x * 2, oy + y, '  ', 'normal'); continue; }
          scr.put(bx + x * 2, oy + y, '  ', blk(LEVEL[c] === 'bright' ? 'normal' : LEVEL[c]));
        }
        if (cur){
          const gy = ghostY();
          if (gy !== cur.y) for (const [x, y] of cells(cur.p, cur.r, cur.x, gy)) if (y >= 0) scr.put(bx + x * 2, oy + y, '[]', 'faint');
          for (const [x, y] of cells(cur.p, cur.r, cur.x, cur.y)) if (y >= 0) scr.put(bx + x * 2, oy + y, '  ', blk('bright'));
        }
        // mini piece preview
        const mini = (p, x, y, level) => { if (!p) return; const n = SHAPES[p].length; const off = n === 4 ? 0 : 1;
          for (const [cx, cy] of STATES[p][0]) scr.put(x + (cx + off) * 2, y + cy - (p === 'I' ? 1 : 0), '  ', blk(level)); };
        if (compact){
          const rx = STACK ? ox + 2 : ox + W + 3, ry = STACK ? oy + BH + 3 : oy;
          scr.put(rx, ry, 'NEXT', 'dim'); mini(queue[0], rx, ry + 1, 'bright');
          scr.put(rx + 10, ry, 'HOLD', canHold ? 'dim' : 'faint'); mini(hold, rx + 10, ry + 1, canHold ? 'normal' : 'faint');
          [['SCORE', score, 'bright'], ['HIGH', Math.max(hi, score), score > hi ? 'bright' : 'normal'], ['LEVEL', level, 'normal'], ['LINES', lines, 'normal']]
            .forEach(([a, v, st], i) => { scr.put(rx, ry + 4 + i, a.padEnd(7), 'dim'); scr.put(rx + 7, ry + 4 + i, String(v), st); });
          const ks = [['\u2190\u2192', 'move'], ['\u2191 x', 'turn'], ['space', 'drop'], ['c', 'hold'], ['p', 'pause'], ['q', 'quit']];
          const ky = ry + 9, two = STACK || scr.rows - ky < ks.length;
          const short = TOUCH ? [['tap', 'sides move'], ['top', 'turn'], ['low', 'drop'], ['q', 'quit']]
            : [['\u2190\u2192', 'move'], ['\u2191', 'turn'], ['spc', 'drop'], ['c', 'hold'], ['p', 'pause'], ['q', 'quit']];
          (two ? short : ks).forEach(([a, b], i) => {
            const x = rx + (two ? (i % 2) * (TOUCH ? 15 : 11) : 0), y = ky + (two ? i >> 1 : i);
            if (y >= scr.rows) return;
            scr.put(x, y, two ? a.padEnd(4) : a.padEnd(7), 'normal'); scr.put(x + (two ? 4 : 7), y, b, 'faint');
          });
        } else {
        // left panel: hold + score
        const lx = ox - 16;
        scr.put(lx, oy, 'HOLD', 'dim'); scr.put(lx + 5, oy, canHold ? '' : '(used)', 'faint');
        mini(hold, lx, oy + 2, canHold ? 'normal' : 'faint');
        scr.put(lx, oy + 6, 'SCORE', 'dim'); scr.put(lx, oy + 7, pad(score, 8), 'bright');
        scr.put(lx, oy + 9, 'HIGH', 'dim'); scr.put(lx, oy + 10, pad(Math.max(hi, score), 8), score > hi ? 'bright' : 'normal');
        scr.put(lx, oy + 12, 'LEVEL', 'dim'); scr.put(lx, oy + 13, pad(level, 8), 'normal');
        scr.put(lx, oy + 15, 'LINES', 'dim'); scr.put(lx, oy + 16, pad(lines, 8), 'normal');
        // right panel: next queue + keys
        const rx = ox + W + 4;
        scr.put(rx, oy, 'NEXT', 'dim');
        mini(queue[0], rx, oy + 2, 'bright');
        mini(queue[1], rx, oy + 6, 'dim');
        mini(queue[2], rx, oy + 9, 'faint');
        const keys = [['\u2190\u2192', 'move'], ['\u2191 x', 'turn'], ['z', 'turn back'], ['\u2193', 'soft drop'], ['space', 'hard drop'], ['c', 'hold'], ['p', 'pause'], ['q', 'quit']];
        keys.forEach(([a, b], i) => { scr.put(rx, oy + 13 + i, a.padEnd(7), 'normal'); scr.put(rx + 7, oy + 13 + i, b, 'faint'); });
        }
        // overlays
        const cardX = bx + 1, cardW = BW * 2 - 2;
        if (paused){
          box(scr, cardX, oy + 7, cardW, 5, 'dim');
          scr.put(cardX + ((cardW - 6) / 2 | 0), oy + 8, 'PAUSED', 'bright');
          const go = TOUCH ? 'tap to resume' : 'p to resume';
          scr.put(cardX + ((cardW - go.length) / 2 | 0), oy + 10, go, 'dim');
        } else if (over){
          const top = Math.max(0, Math.min(5, BH - 10));
          box(scr, cardX, oy + top, cardW, 10, 'normal');
          const c = (y, s, st) => scr.put(cardX + ((cardW - s.length) / 2 | 0), oy + top + y - 5, s, st);
          c(6, 'GAME  OVER', 'bright');
          c(8, 'score ' + score, 'normal');
          c(9, lines + ' lines  lvl ' + level, 'dim');
          c(10, newHi ? '* new high score *' : 'best ' + hi, newHi ? 'accent' : 'dim');
          if (REDUCED || Math.floor(t * 2) % 2 === 0) c(12, TOUCH ? 'tap again' : 'enter again', 'normal');
          c(13, 'q quit', 'faint');
        } else if (help && score === 0){
          scr.put(bx + 3, oy + 3, TOUCH ? ' tap to play' : 'arrows to play', 'dim');
        }
      },
    };
  },
};

/* =====================================================================================
   SNAKE: buffered turns, speed-up, high score, pause, game-over card
   ===================================================================================== */
const SNAKE_HI = 'kaiav.snake.hi';
T.apps.snake = {
  g: 'fun',
  desc: 'the snake game',
  usage: 'snake',
  more: 'eat, grow, and stay off the walls and your own tail. arrows or wasd turn, p pauses, q quits. on a phone, tap beside the head to turn.',
  start(api){
    const cols = api.cols || 72, rows = api.rows || 23;
    const GW = Math.floor((cols - 2) / 2), GH = rows - 3;    // cells are 2 columns wide, so they look square
    const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right', k: 'up', j: 'down', h: 'left', l: 'right' };
    let body, dir, queue, food, score, step, acc, paused, over, hi = hiGet(SNAKE_HI), newHi, t = 0, started, eaten;
    function placeFood(){
      const taken = new Set(body.map(([x, y]) => x + ',' + y));
      if (taken.size >= GW * GH) return null;
      let p; do { p = [Math.random() * GW | 0, Math.random() * GH | 0]; } while (taken.has(p[0] + ',' + p[1]));
      return p;
    }
    function reset(){
      const cx = GW / 2 | 0, cy = GH / 2 | 0;
      body = [[cx, cy], [cx - 1, cy], [cx - 2, cy], [cx - 3, cy]];
      dir = 'right'; queue = []; score = 0; eaten = 0; step = 0.13; acc = 0; paused = false; over = false; newHi = false; started = false;
      food = placeFood();
    }
    reset();
    const opposite = (a, b) => DIRS[a][0] === -DIRS[b][0] && DIRS[a][1] === -DIRS[b][1];
    function advance(){
      // take the next buffered turn that is a real change; skip ones made illegal by the queue itself
      while (queue.length){ const d = queue.shift(); if (d !== dir && !opposite(d, dir)){ dir = d; break; } }
      const [dx, dy] = DIRS[dir];
      const head = [body[0][0] + dx, body[0][1] + dy];
      const willEat = food && head[0] === food[0] && head[1] === food[1];
      const tailIdx = willEat ? body.length : body.length - 1;   // the tail moves away this step unless we grow
      const hit = head[0] < 0 || head[1] < 0 || head[0] >= GW || head[1] >= GH ||
        body.some(([x, y], i) => i < tailIdx && x === head[0] && y === head[1]);
      if (hit){
        over = true;
        if (score > hi){ hi = score; newHi = true; hiSet(SNAKE_HI, hi); }
        sound(api, 'error');
        return;
      }
      body.unshift(head);
      if (willEat){
        eaten++; score += 10 + Math.floor(eaten / 5) * 5;
        step = Math.max(0.05, step * 0.965);
        food = placeFood();
        sound(api, 'beep');
      } else body.pop();
    }
    let headAt = [0, 0];                                     // the head's screen cell, from the last render
    function turn(d){
      const last = queue.length ? queue[queue.length - 1] : dir;
      if (d !== last && !opposite(d, last) && queue.length < 3) queue.push(d);
    }
    return {
      /* phones: tap on the side of the head you want to go; the snake turns that way */
      tap(col, row){
        if (over){ reset(); return true; }
        if (paused){ paused = false; return true; }
        started = true;
        const last = queue.length ? queue[queue.length - 1] : dir;
        const dx = (col - headAt[0]) / 2, dy = row - headAt[1];
        if (last === 'left' || last === 'right'){ if (dy) turn(dy < 0 ? 'up' : 'down'); }
        else if (dx) turn(dx < 0 ? 'left' : 'right');
        return true;
      },
      key(e){
        const k = e.key;
        if (over){
          if (k === 'Enter' || k === 'r' || k === 'R') reset();
          else if (isQuit(k)) api.exit(0);
          return true;
        }
        if (isQuit(k)){ api.print(`snake: ${score} points, length ${body.length}. high score ${Math.max(hi, score)}`); if (score > hi) hiSet(SNAKE_HI, score); api.exit(0); return true; }
        if (k === 'p' || k === 'P' || (k === ' ' && started)){ paused = !paused; return true; }
        const d = KEYMAP[k];
        if (d && !paused){ started = true; turn(d); }
        else if (!started && (k === ' ' || k === 'Enter')) started = true;
        return true;
      },
      tick(dt){
        dt = Math.min(secs(dt), 0.1); t += dt;
        if (over || paused || !started) return Math.floor(t * 2) !== Math.floor((t - dt) * 2);
        acc += dt;
        let dirty = false;
        while (acc >= step && !over){ acc -= step; advance(); dirty = true; }
        return dirty;
      },
      render(scr){
        scr.clear(); scr.cursor(0, 0, null);
        const ox = ((scr.cols - GW * 2 - 2) / 2) | 0, oy = 1;
        // status line
        scr.put(ox, 0, 'SNAKE', 'bright');
        scr.put(ox + 8, 0, 'score ' + score, 'normal');
        scr.put(ox + 22, 0, 'length ' + body.length, 'dim');
        const hs = 'best ' + Math.max(hi, score);
        scr.put(ox + GW * 2 + 2 - hs.length, 0, hs, score > hi && hi > 0 ? 'bright' : 'dim');
        // walls
        scr.put(ox, oy, '+' + '-'.repeat(GW * 2) + '+', 'faint');
        for (let y = 0; y < GH; y++){ scr.put(ox, oy + 1 + y, '|', 'faint'); scr.put(ox + GW * 2 + 1, oy + 1 + y, '|', 'faint'); }
        scr.put(ox, oy + GH + 1, '+' + '-'.repeat(GW * 2) + '+', 'faint');
        const at = (x, y, s, st) => scr.put(ox + 1 + x * 2, oy + 1 + y, s, st);
        // food blinks gently
        if (food) at(food[0], food[1], '<>', REDUCED || Math.floor(t * 3) % 3 ? 'bright' : 'normal');
        // body: tail fades through the phosphor levels
        const n = body.length;
        for (let i = n - 1; i >= 1; i--){
          const f = i / n;
          at(body[i][0], body[i][1], '  ', blk(f < 0.5 ? 'normal' : f < 0.85 ? 'dim' : 'faint'));
        }
        const [hx, hy] = body[0];
        headAt = [ox + 1 + hx * 2, oy + 1 + hy];
        at(hx, hy, over ? 'xx' : '  ', blk('bright'));
        const cw = 30, cx = ox + 1 + ((GW * 2 - cw) / 2 | 0), cy = oy + ((GH - 9) / 2 | 0) + 1;
        const c = (y, s, st) => scr.put(cx + ((cw - s.length) / 2 | 0), cy + y, s, st);
        if (over){
          box(scr, cx, cy, cw, 10, 'normal');
          c(1, 'G A M E   O V E R', 'bright');
          c(3, score + ' points', 'normal');
          c(4, 'length ' + n + '   apples ' + eaten, 'dim');
          c(6, newHi ? '* new high score *' : 'best ' + hi, newHi ? 'accent' : 'dim');
          c(8, (TOUCH ? 'tap again' : 'enter again') + '  \u00b7  q quit', REDUCED || Math.floor(t * 2) % 2 === 0 ? 'normal' : 'dim');
        } else if (paused){
          box(scr, cx, cy + 2, cw, 5, 'dim');
          c(3, 'PAUSED', 'bright'); c(5, TOUCH ? 'tap to resume' : 'p to resume', 'dim');
        } else if (!started){
          box(scr, cx, cy + 1, cw, 7, 'dim');
          c(2, 'S N A K E', 'bright');
          c(4, TOUCH ? 'tap beside the head to turn' : 'arrows or wasd to start', 'normal');
          c(5, TOUCH ? 'tap to start' : 'p pause  \u00b7  q quit', 'faint');
        }
      },
    };
  },
};

/* =====================================================================================
   DONUT: a1k0n's spinning torus, luminance mapped to phosphor levels
   ===================================================================================== */
const LUM = '.,-:;=+!*#$@';      // VT323 draws ~ as a squiggle, so it is left out
const LUM_STYLE = ['faint', 'faint', 'faint', 'dim', 'dim', 'dim', 'normal', 'normal', 'normal', 'bright', 'bright', 'bright'];
T.apps.donut = {
  g: 'fun',
  desc: 'a spinning ascii donut, after a1k0n',
  usage: 'donut',
  more: 'hold the arrows to spin it. space pauses, + and - change the idle speed, r resets, q quits.',
  start(api){
    const IDLE_A = REDUCED ? 0 : 1.0, IDLE_B = REDUCED ? 0 : 0.5, SPIN = 3.4;   // idle drift (none with reduced motion) and held-arrow spin (rad/s)
    let A = 1, B = 0, vA = IDLE_A, vB = IDLE_B;     // angles and spin speeds (rad/s)
    let idle = 1, paused = false, t = 0, gotUp = false, note = '', noteT = 0;
    const held = { up: 0, down: 0, left: 0, right: 0 };   // time of the last keydown, 0 when released
    const DIR = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
    // without keyup events, a held key is assumed released ~150 ms after its last auto-repeat
    const isHeld = d => held[d] > 0 && (gotUp || t - held[d] < 0.15);
    const say = s => { note = s; noteT = t; };
    let cols = api.cols || 72, rows = api.rows || 23;
    let chars = [], styles = [], acc = 0;
    function frame(){
      const n = cols * rows;
      const out = new Array(n).fill(' '), lv = new Array(n).fill(-1), z = new Float32Array(n);
      const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
      const R1 = 1, R2 = 2, K2 = 5;
      // scale so the donut fills the grid height; character cells are ~2x taller than wide
      const h = rows - 1;                                   // bottom row holds the hint
      let K1y = h * K2 * 3 / (8 * (R1 + R2)) * 1.02;
      const K1x = Math.min(K1y * 2.05, cols * K2 * 3 / (8 * (R1 + R2)) * 1.02);
      K1y = Math.min(K1y, K1x / 2.05);                      // keep it round on tall, narrow (phone) grids
      for (let th = 0; th < 6.283; th += 0.05){
        const ct = Math.cos(th), st = Math.sin(th);
        for (let ph = 0; ph < 6.283; ph += 0.015){
          const cp = Math.cos(ph), sp = Math.sin(ph);
          const cx = R2 + R1 * ct, cy = R1 * st;
          const x = cx * (cB * cp + sA * sB * sp) - cy * cA * sB;
          const y = cx * (sB * cp - sA * cB * sp) + cy * cA * cB;
          const zz = K2 + cA * cx * sp + cy * sA;
          const ooz = 1 / zz;
          const xp = (cols / 2 + K1x * ooz * x) | 0;
          const yp = (h / 2 - K1y * ooz * y) | 0;
          if (xp < 0 || xp >= cols || yp < 0 || yp >= h) continue;
          const L = cp * ct * sB - cA * ct * sp - sA * st + cB * (cA * st - ct * sA * sp);
          const i = xp + yp * cols;
          if (ooz > z[i]){
            z[i] = ooz;
            const li = L > 0 ? Math.min(11, (L * 8) | 0) : 0;
            out[i] = LUM[li]; lv[i] = li;
          }
        }
      }
      chars = out; styles = lv;
    }
    frame();
    return {
      key(e){
        const k = e.key;
        if (DIR[k]){ held[DIR[k]] = t || 1e-6; return true; }
        if (isQuit(k)){ api.exit(0); return true; }
        if (k === ' '){ paused = !paused; say(paused ? 'paused' : ''); return true; }
        if (k === '+' || k === '='){ idle = Math.min(4, idle * 1.4); say('idle speed x' + idle.toFixed(1)); return true; }
        if (k === '-' || k === '_'){ idle = Math.max(0.15, idle / 1.4); say('idle speed x' + idle.toFixed(1)); return true; }
        if (k === 'r' || k === 'R'){ A = 1; B = 0; vA = IDLE_A; vB = IDLE_B; idle = 1; paused = false; say('reset'); frame(); return true; }
        return true;                         // everything else is ignored, not a way out
      },
      keyUp(e){
        gotUp = true;
        const d = DIR[e.key]; if (d) held[d] = 0;
        return false;
      },
      tick(dt){
        dt = Math.min(secs(dt), 0.1); t += dt;
        const ay = (isHeld('up') ? 1 : 0) - (isHeld('down') ? 1 : 0);
        const bx = (isHeld('right') ? 1 : 0) - (isHeld('left') ? 1 : 0);
        const restA = paused ? 0 : IDLE_A * idle, restB = paused ? 0 : IDLE_B * idle;
        // held: snap quickly to a firm spin; released: coast, easing back to the idle drift
        vA += ((ay ? ay * SPIN : restA) - vA) * Math.min(1, dt * (ay ? 10 : 1.1));
        vB += ((bx ? bx * SPIN : restB) - vB) * Math.min(1, dt * (bx ? 10 : 1.1));
        A += vA * dt; B += vB * dt;
        acc += dt;
        const noteDirty = note && note !== 'paused' && t - noteT > 1.6 ? (note = '', true) : false;
        if (Math.abs(vA) + Math.abs(vB) < 1e-3 && !noteDirty) return false;
        if (acc < 1 / 40 && !noteDirty) return false;     // ~40 fps is plenty for a phosphor tube
        acc = 0; frame();
        return true;
      },
      render(scr){
        if (scr.cols !== cols || scr.rows !== rows){ cols = scr.cols; rows = scr.rows; frame(); }

/* =====================================================================================
   timer: big digits counting down
   ===================================================================================== */
function parseDur(s){
  s = String(s || '').trim().toLowerCase(); if (!s) return null;
  let m;
  if ((m = /^(\d+):(\d{1,2})(?::(\d{1,2}))?$/.exec(s))) return m[3] != null ? (+m[1] * 3600 + +m[2] * 60 + +m[3]) : (+m[1] * 60 + +m[2]);
  if (/^\d*\.?\d+$/.test(s)) return parseFloat(s) * 60;            // a bare number is minutes
  let t = 0, any = false; const re = /(\d*\.?\d+)\s*(h|hr|hrs|hours?|m|min|mins|minutes?|s|sec|secs|seconds?)/g;
  let rest = s.replace(re, (x, n, u) => { any = true; t += parseFloat(n) * (u[0] === 'h' ? 3600 : u[0] === 'm' ? 60 : 1); return ''; });
  return any && !rest.trim() ? t : null;
}
const fmtHMS = (sec, tenths) => {
  sec = Math.max(0, sec); const s = Math.floor(sec), h = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = s % 60;
  return (h ? h + ':' + two(mm) : String(mm)) + ':' + two(ss) + (tenths ? '.' + Math.floor((sec - s) * 10) : '');
};
T.apps.timer = { g: 'tools', desc: 'count down, then beep', usage: 'timer duration', ex: ['timer 5m', 'timer 90s', 'timer 1:30', 'timer 1h 15m'],
  more: 'counts down in big digits and beeps when it reaches zero. a bare number is minutes. space pauses, + and - add or take a minute, r starts over, q quits.',
  start(api, argv){
    const now = () => performance.now() / 1000;
    let dur = parseDur(argv.slice(1).join(' ')), t0 = now(), paused = false, pausedAt = 0, done = false, doneAt = 0, lastSec = -1, beeps = 0, beepT = 0;
    if (!(dur > 0)){ api.print(argv[1] ? 'timer: cannot read ' + argv.slice(1).join(' ') + '  (try: timer 5m, 90s or 1:30)' : 'usage: timer duration  (try: timer 5m, 90s or 1:30)'); api.exit(2); return {}; }
    if (dur > 86400){ api.print('timer: up to 24 hours'); api.exit(2); return {}; }
    const elapsed = () => (paused ? pausedAt : now()) - t0;
    const finish = () => { api.print('timer: ' + fmtHMS(dur) + (done ? ' done' : ', stopped with ' + fmtHMS(Math.ceil(dur - elapsed())) + ' left')); api.exit(0); };
    return {
      key(e){
        if (e.ctrlKey || e.metaKey) return false;
        const k = e.key;
        if (done || isQuit(e)){ finish(); return true; }
        if (k === ' ' || k === 'p' || k === 'Enter'){ if (paused){ t0 += now() - pausedAt; paused = false; } else { pausedAt = now(); paused = true; } return true; }
        if (k === 'r' || k === 'R'){ t0 = now(); paused = false; return true; }
        if (k === '+' || k === '='){ dur += 60; return true; }
        if (k === '-'){ dur = Math.max(elapsed() + 1, dur - 60); return true; }
        return false;
      },
      tick(dt){
        if (beeps > 0){ beepT -= dt; if (beepT <= 0){ beep(api); beeps--; beepT = 0.32; } }
        if (!paused && !done && elapsed() >= dur){ done = true; doneAt = now(); beeps = 4; beepT = 0; return true; }
        if (done && now() - doneAt > 60) finish();
        const s = Math.floor(now() * 2);
        if (s !== lastSec){ lastSec = s; return true; }
        return false;
      },
      render(scr){
        scr.clear();
        const W = scr.cols, H = scr.rows;
        let big = fmtHMS(Math.ceil(Math.max(0, dur - elapsed()) - 1e-6)), small = '';
        const frac = Math.min(1, elapsed() / dur), avail = H - 7;
        let f = fitScale(big, W - 4, avail);
        if ((!f || f.sx < 2) && big.split(':').length === 3){       // too small with seconds: big h:mm, small :ss
          const short = big.slice(0, big.lastIndexOf(':')), g2 = fitScale(short, W - 4, avail);
          if (g2 && (!f || g2.sx > f.sx)){ small = big.slice(big.lastIndexOf(':')); big = short; f = g2; }
        }
        const blockH = f ? f.h : 1, top = Math.max(2, ((H - blockH - 5) / 2) | 0);
        center(scr, top - 2, spaced('timer'), 'dim');
        const flash = done && !REDUCED && Math.floor(now() * 2) % 2 === 0;
        const st = blk(done ? (flash ? 'bright' : 'dim') : paused ? 'dim' : 'bright');
        if (f){
          const beside = small && f.w + small.length + 1 <= W - 2, x = ((W - f.w - (beside ? small.length + 1 : 0)) / 2) | 0;
          bigText(scr, x, top, big, f.sx, f.sy, st);
          if (small){ if (beside) scr.put(x + f.w + 1, top + f.h - 1, small, 'dim'); else scr.put(x + f.w - small.length, top + f.h, small, 'dim'); }
        } else center(scr, top, big, 'bright');
        let y = top + blockH + 1;
        const bw = Math.min(W - 8, f ? Math.max(f.w, 20) : 30), bx = ((W - bw) / 2) | 0;
        scr.fill(bx, y, bw, 1, '·', 'faint'); scr.fill(bx, y, Math.round(bw * frac), 1, ' ', blk(done ? 'bright' : 'dim'));
        y += 2;
        center(scr, y, done ? "time's up" : paused ? 'paused' : fmtHMS(dur) + ' timer', done ? 'bright' : 'normal');
        keysLine(scr, H - 1, done ? [['any key', 'done']] : [['space', paused ? 'resume' : 'pause'], ['q', 'quit'], ['+/-', 'a minute'], ['r', 'restart']]);
      },
    };
  } };

/* =====================================================================================

const PASSAGES = [
  'The quick brown fox jumps over the lazy dog, then naps in the sun while the rest of us keep typing.',
  'A good terminal waits patiently. It does not mind a typo; it only asks that you press enter when you mean it.',
  'Build the small version first. Show it to someone. Listen closely, change one thing, and show it again tomorrow.',
  'The lamp hums, the coffee cools, and the cursor blinks on. There is always one more line worth writing tonight.',

  'Most hard problems get easier once you write them down. The rest get easier after a walk and a glass of water.',

const TYPE_BEST = 'kaiav.typing.best';
T.apps.typing = { g: 'fun', desc: 'a typing test', usage: 'typing',
  more: 'type the passage as it appears. the clock starts on your first key. mistakes light up; backspace fixes them. at the end you get words per minute (five characters to a word, correct ones only) and accuracy. tab gives a new passage, esc quits.',
  start(api){
    let best = lsGet(TYPE_BEST, 0) || 0, order = PASSAGES.map((_, i) => i).sort(() => Math.random() - 0.5), pi = 0;
    let text, typed, t0, t1, keys, errs, done, newBest, lastShow = -1;
    const now = () => performance.now() / 1000;
    function reset(){ text = PASSAGES[order[pi++ % order.length]]; typed = ''; t0 = 0; t1 = 0; keys = 0; errs = 0; done = false; newBest = false; }
    reset();
    const correct = () => { let n = 0; for (let i = 0; i < typed.length; i++) if (typed[i] === text[i]) n++; return n; };
    const secs = () => t0 ? ((done ? t1 : now()) - t0) : 0;
    const wpm = () => { const s = secs(); return s > 0.5 ? Math.round(correct() / 5 / (s / 60)) : 0; };
    const acc = () => keys ? Math.max(0, Math.round((keys - errs) / keys * 100)) : 100;
    function end(){
      done = true; t1 = now();
      const w = wpm(); if (acc() >= 80 && w > best){ best = w; newBest = true; lsSet(TYPE_BEST, best); }
      api.sound && beep(api);
    }

      key(e){

        if (k === 'Tab' || (done && k === 'Enter')){ if (e.preventDefault) e.preventDefault(); reset(); return true; }
        if (done){ if (k === 'q' || k === 'Q'){ api.print('typing: ' + wpm() + ' wpm, ' + acc() + '% accurate' + (newBest ? ', a new best' : '')); api.exit(0); } return true; }
        if (k === 'Backspace'){ typed = typed.slice(0, -1); return true; }
        if (k.length !== 1) return false;
        if (!t0) t0 = now();
        keys++; if (k !== text[typed.length]) errs++;
        typed += k;
        if (typed.length >= text.length) end();
        return true;
      },
      tick(){ const s = t0 && !done ? Math.floor(secs() * 2) : -1; if (s !== lastShow){ lastShow = s; return true; } return false; },
      render(scr){

        scr.put(x0 + w - stats.length, 0, stats, t0 ? 'normal' : 'faint');
        scr.fill(x0, 1, w, 1, '·', 'faint');
        // lay the passage out word by word, keeping each character's index

        words.forEach((wd, i) => {
          const piece = wd + (i < words.length - 1 ? ' ' : '');

        });
        if (line.length) lines.push(line);

        lines.forEach((ln, r) => ln.forEach((i, c) => {

        }));
        if (done){
          scr.cursor(null);
          const y = ty + lines.length * 2 + 1;
          const n = String(wpm()), f = fitScale(n, W - 20, Math.max(5, H - y - 4)) || { sx: 1, sy: 1, w: bitWidth(DIG3, n), h: 5 };
          const bx = x0, by = y;
          if (y + f.h + 2 < H){ bigText(scr, bx, by, n, f.sx, f.sy, blk('bright')); scr.put(bx + f.w + 2, by + f.h - 1, 'wpm', 'dim'); }
          const sx = bx + f.w + 8 <= x0 + w - 14 ? bx + f.w + 8 : x0, sy = sx === x0 ? by + f.h + 1 : by;
          scr.put(sx, sy, 'accuracy', 'dim'); scr.put(sx + 10, sy, acc() + '%', 'normal');
          scr.put(sx, sy + 1, 'time', 'dim'); scr.put(sx + 10, sy + 1, fmtHMS(secs()), 'normal');
          scr.put(sx, sy + 2, 'best', 'dim'); scr.put(sx + 10, sy + 2, best ? best + ' wpm' + (newBest ? '  new best' : '') : '-', newBest ? 'bright' : 'normal');

        } else {

        }

/* =====================================================================================
   shared: coloured JSON, span wrapping, little helpers
   ===================================================================================== */
const kb = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const msStr = ms => ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(1) + ' s';
const clip = (t, n) => t.length <= n ? t : t.slice(0, Math.max(1, n - 3)).trimEnd() + '...';
const bareUrl = u => String(u || '').replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
const argText = (io, a) => a.length ? a.join(' ') : String(io.stdin || '');
/* JSON -> lines of { ind, toks: [[text, style]] }: keys dim, strings normal, numbers bright, literals accent, punctuation faint */
function jsonLines(v){
  const lines = [];
  const scalar = x => typeof x === 'string' ? [JSON.stringify(x), 'n'] : typeof x === 'number' ? [String(x), 'b'] : [String(x), 'a'];
  (function walk(x, ind, pre, comma){
    const cm = comma ? [[',', 'f']] : [];
    if (x && typeof x === 'object'){
      const arr = Array.isArray(x), ks = arr ? x.map((_, i) => i) : Object.keys(x);
      if (!ks.length){ lines.push({ ind, toks: [...pre, [arr ? '[]' : '{}', 'f'], ...cm] }); return; }
      lines.push({ ind, toks: [...pre, [arr ? '[' : '{', 'f']] });
      ks.forEach((k, i) => walk(x[k], ind + 2, arr ? [] : [[JSON.stringify(String(k)), 'd'], [': ', 'f']], i < ks.length - 1));
      lines.push({ ind, toks: [[arr ? ']' : '}', 'f'], ...cm] });
    } else lines.push({ ind, toks: [...pre, scalar(x), ...cm] });
  })(v, 0, [], false);
  return lines;
}
/* cut a line of spans into rows no wider than width; continuation rows are indented by cont */
function wrapSpans(toks, width, cont = 2){
  const rows = []; let row = [], w = 0, room = width;
  for (let [t, st] of toks){
    while (t.length){
      if (w >= room){ rows.push(row); row = []; w = 0; room = Math.max(8, width - cont); }
      const take = t.slice(0, room - w); row.push([take, st]); w += take.length; t = t.slice(take.length);
    }
  }
  rows.push(row);
  return rows.map((r, i) => ({ cont: i > 0, toks: r }));
}
/* print a JSON value on the screen, coloured and wrapped, at most max rows; returns rows not shown */
function showJSON(o, v, cols, max = 1e9, i0 = 2){
  let n = 0, hidden = 0;
  for (const l of jsonLines(v)){
    for (const r of wrapSpans(l.toks, cols - i0 - l.ind - 1)){
      if (n >= max){ hidden++; continue; }
      o.at(i0 + l.ind + (r.cont ? 2 : 0), ...(r.toks.length ? r.toks : [['', 'n']])); n++;
    }
  }
  return hidden;
}
