  const m = new Map(), k = x => String(x);
  const get = x => { if (m.has(k(x))) return m.get(k(x)); try { return real ? real.getItem(x) : null; } catch (e){ return null; } };
  try { Object.defineProperty(window, n, { configurable: true, value: { getItem: get, setItem: (x, v) => { m.set(k(x), String(v)); }, removeItem: x => { m.set(k(x), null); } } }); } catch (e){}
