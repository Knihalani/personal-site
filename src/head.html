<style>
/* One full-bleed 3D scene; the only DOM is a quiet hint, a sound toggle, a hidden input (the real text field for
   phones and assistive tech) and a visually hidden summary plus a live log of the terminal. Single dark theme by design. */
:root{ color-scheme: dark; --bg: #07080a; --fg: #e9e2d0; --dim: rgba(233,226,208,.5); --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace }
html, body{ margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font: 12px/1.4 var(--mono) }
#stage{ position: fixed; inset: 0 }
#stage canvas{ display: block; width: 100%; height: 100%; outline: none }
/* phones: a slim header strip holds the sound toggle; the terminal fills the rest (main.js sizes it) */
body.phone{ background: #0a0f0a; --hdr: calc(env(safe-area-inset-top, 0px) + 34px) }
body.phone #mute{ top: calc(env(safe-area-inset-top, 0px) + 6px); bottom: auto; padding: 4px 8px; font-size: 11px }
body.phone #mute::after{ content: ""; position: absolute; inset: -10px -8px }   /* a finger-sized target around the small box */
body.phone #stage{ overflow: hidden; touch-action: none }
body.phone::before{ content: ""; position: fixed; top: 0; left: 0; right: 0; height: var(--hdr); background: #0a0f0a; z-index: 1 }
#stage .phone-term{ position: absolute; top: var(--hdr); left: 0; width: 100%; transition: transform .25s cubic-bezier(.2,.8,.2,1) }
.ui{ position: fixed; z-index: 2; font: 500 11px var(--mono); letter-spacing: .08em; color: var(--dim) }
#hint{ left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); transition: opacity 1.2s; pointer-events: none; text-align: center;
  font-size: 13px; letter-spacing: .04em; color: rgba(233,226,208,.68); text-shadow: 0 1px 8px rgba(0,0,0,.8) }
#mute{ right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); background: none; border: 1px solid rgba(233,226,208,.18); color: var(--dim); font: inherit; letter-spacing: inherit; padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 7px }
#mute::before{ content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1px solid currentColor; box-sizing: border-box }
#mute[aria-pressed="true"]::before{ background: #8dffb4; border-color: #8dffb4; box-shadow: 0 0 6px rgba(141,255,180,.6) }
#mute:hover{ color: var(--fg); border-color: rgba(233,226,208,.4) }
#mute:focus-visible{ outline: 1px solid rgba(233,226,208,.5); outline-offset: 2px }
#kbd{ position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; resize: none }
.sr{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
#loading{ position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); font: 500 11px var(--mono); letter-spacing: .3em; text-transform: uppercase; transition: opacity .35s; z-index: 3; background: var(--bg) }
#loading.gone{ opacity: 0; pointer-events: none }
noscript{ position: fixed; inset: 0; z-index: 4; display: grid; place-content: center; gap: 6px; background: var(--bg); font-size: 14px; text-align: center }
noscript h1{ margin: 0; font: 500 18px var(--mono) } noscript p{ margin: 0; color: var(--dim) } noscript a{ color: #8dffb4 }
/* the flat terminal on a desktop (no WebGL, or three.js did not load): one centred column, sized by main.js */
body.flat #stage .phone-term{ right: 0; margin: 0 auto }
@media (prefers-reduced-motion: reduce){ #hint, #loading, #stage .phone-term{ transition: none } }
/* high contrast: the sound toggle's dot keeps showing its state in system colours */
@media (forced-colors: active){ #mute::before{ forced-color-adjust: none; border-color: ButtonText } #mute[aria-pressed="true"]::before{ background: ButtonText; box-shadow: none } }
</style>
<script>
/* storage that throws (blocked site data, some private modes): every module gets an in-memory stand-in for this visit */
for (const n of ['localStorage', 'sessionStorage']){
  let real = null;
  try { real = window[n]; real.setItem('kaiav.probe', '1'); real.removeItem('kaiav.probe'); continue; } catch (e){}
  const m = new Map(), k = x => String(x);
  const get = x => { if (m.has(k(x))) return m.get(k(x)); try { return real ? real.getItem(x) : null; } catch (e){ return null; } };
  try { Object.defineProperty(window, n, { configurable: true, value: { getItem: get, setItem: (x, v) => { m.set(k(x), String(v)); }, removeItem: x => { m.set(k(x), null); } } }); } catch (e){}
}
</script>
