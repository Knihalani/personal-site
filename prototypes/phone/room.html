<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#a6e4ff">
<title>Kaiav's Place</title>
<meta name="description" content="Kaiav Nihalani. Walk around a tiny pixel house and find out stuff.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2a4c; --ink2:#4b4a75; --cream:#fff6e0; --paper:#fffaf0;
  --coral:#ff7b6b; --coralD:#d9534f; --sun:#ffd54a; --sunD:#f2a83b;
  --teal:#46c7b5; --tealD:#2e9a96; --sky:#a6e4ff; --lilac:#b8a2f2; --blue:#5b8def; --grass:#7fd067;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --px:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#7fd067;overflow:hidden;color:var(--ink);font-family:'Pixelify Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
[hidden]{display:none!important}

/* pixel chip */
.chip{border:0;background:var(--paper);box-shadow:var(--px),0 6px 0 0 rgba(43,42,76,.28);padding:5px 10px;font-weight:600;font-size:15px;line-height:1;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.chip:active{transform:translateY(2px)}
.chip img{image-rendering:pixelated;display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:12px;
  padding:calc(var(--sat) + 14px) calc(var(--sar) + 15px) 0 calc(var(--sal) + 15px);pointer-events:none;transition:opacity .3s}
#hud>*{pointer-events:auto}
#hud .sp{flex:1}
#found{gap:8px}
#found b{font-size:17px;min-width:30px}
#pips{display:flex;gap:3px}
#pips i{width:6px;height:6px;background:#e8dcc4;display:block}
#pips i.on{background:var(--coral)}
#found.pop{animation:pop .5s}
@keyframes pop{30%{transform:scale(1.18) rotate(-3deg)}}
#btnRead{font-size:14px;white-space:nowrap}
@media (max-width:374px){#pips{display:none}#hud{gap:9px}}

/* area banner + toast */
#banner{position:absolute;left:50%;top:calc(var(--sat) + 64px);z-index:5;transform:translate(-50%,-14px);opacity:0;pointer-events:none;
  font-weight:700;font-size:15px;letter-spacing:2px;color:var(--ink);background:var(--sun);box-shadow:var(--px),0 6px 0 0 rgba(43,42,76,.28);padding:7px 14px;white-space:nowrap;transition:opacity .35s,transform .35s}
#banner.show{opacity:1;transform:translate(-50%,0)}
#toast{position:absolute;left:50%;top:calc(var(--sat) + 64px);z-index:7;transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  background:var(--paper);box-shadow:var(--px),0 6px 0 0 rgba(43,42,76,.28);padding:9px 14px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:center;white-space:nowrap;transition:opacity .3s,transform .3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .k{background:var(--coral);color:#fff;padding:2px 6px;font-size:13px;letter-spacing:1px}
#hint{position:absolute;left:50%;bottom:calc(var(--sab) + 182px);z-index:5;transform:translateX(-50%);opacity:0;transition:opacity .4s;pointer-events:none;
  background:rgba(255,250,240,.94);box-shadow:var(--px);padding:8px 12px;font-size:14px;text-align:center;width:max-content;max-width:calc(100% - 40px);line-height:1.3}
#hint.show{opacity:1}

/* controls */
#ctrl{position:absolute;left:0;right:0;bottom:0;height:calc(178px + var(--sab));z-index:4;transition:opacity .25s}
#ctrl.off{opacity:0;pointer-events:none}
#ctrl::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,246,224,0),rgba(255,246,224,.35));pointer-events:none}
#base{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,250,240,.55) 58%,rgba(255,250,240,.75) 60%);box-shadow:0 0 0 3px rgba(43,42,76,.5);transition:opacity .2s}
#base::after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(43,42,76,.18)}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:var(--coral);
  box-shadow:inset 0 -6px 0 var(--coralD),inset 0 4px 0 #ffb0a3,0 0 0 3px var(--ink),0 5px 0 3px rgba(43,42,76,.3)}
#abtn{position:absolute;right:calc(var(--sar) + 30px);bottom:calc(var(--sab) + 52px);width:88px;height:88px;border-radius:50%;border:0;padding:0;
  background:#e9e0cd;box-shadow:inset 0 -7px 0 #cfc3ab,0 0 0 3px var(--ink),0 6px 0 3px rgba(43,42,76,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .15s}
#abtn b{font-size:32px;line-height:.9;font-weight:700;color:#8f88a8}
#abtn small{font-size:12px;letter-spacing:1px;margin-top:2px;color:#8f88a8;font-weight:600}
#abtn.on{background:var(--sun);box-shadow:inset 0 -7px 0 var(--sunD),inset 0 4px 0 #fff0a8,0 0 0 3px var(--ink),0 6px 0 3px rgba(43,42,76,.3);animation:breathe 1.2s infinite}
#abtn.on b,#abtn.on small{color:var(--ink)}
#abtn:active,#abtn.down{transform:translateY(4px)}
@keyframes breathe{50%{transform:scale(1.06)}}

/* dialog */
#dlg{position:absolute;left:calc(var(--sal) + 14px);right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 16px);z-index:8;
  background:var(--paper);box-shadow:var(--px),0 8px 0 0 rgba(43,42,76,.3);padding:24px 16px 10px;
  animation:dlgIn .22s cubic-bezier(.2,1.4,.5,1)}
#dlg .scr{max-height:calc(100vh - var(--sat) - var(--sab) - 170px);max-height:calc(100dvh - var(--sat) - var(--sab) - 170px);overflow-y:auto;touch-action:pan-y;margin:0 -6px;padding:0 6px 4px}
#dlg .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;min-height:16px;font-size:13px;color:var(--ink2)}
#dlg .foot .pg{color:#a8a3bd;font-size:12px}
@keyframes dlgIn{from{transform:translateY(30px);opacity:0}}
#dlg .tag{position:absolute;left:12px;top:-14px;background:var(--coral);color:#fff;padding:5px 10px 4px;font-size:13px;letter-spacing:2px;font-weight:700;box-shadow:var(--px)}
#dlg .x{position:absolute;right:12px;top:-16px;min-height:30px;padding:4px 10px;font-size:14px}
#dlg .row1{display:flex;gap:13px;align-items:flex-start}
#dlg canvas.por{width:60px;height:60px;flex:none;image-rendering:pixelated;background:#f3ead6;box-shadow:0 0 0 3px var(--ink);margin:3px 0 0 3px}
#dlg .body{flex:1;min-width:0}
#dlg h3{margin:0 0 2px;font-size:21px;font-weight:700;line-height:1.1}
#dlg .sub{font-size:14px;color:var(--ink2);margin-bottom:6px;line-height:1.25}
#dlg .txt{font-size:18px;line-height:1.38;white-space:pre-line;min-height:50px;overflow-wrap:anywhere}
#dlg .txt .gh{visibility:hidden}
#dlg .txt.q{font-style:normal}
#dlg .attr{font-size:14px;color:var(--ink2);margin-top:4px}
#dlg .ext{margin-top:12px;display:flex;flex-direction:column;gap:9px}
#dlg .ext:empty{display:none}
#dlg .ch{margin-top:14px;display:flex;flex-direction:column;gap:9px}
#dlg .ch:empty{display:none}
#dlg .nx{animation:nx .8s infinite;pointer-events:none}
@keyframes nx{50%{transform:translateY(3px)}}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:var(--sun);color:var(--ink);text-decoration:none;
  padding:11px 14px;font-weight:600;font-size:16px;box-shadow:var(--px),0 5px 0 0 rgba(43,42,76,.28);min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:var(--px)}
.btn.alt{background:#efe6d2}
.btn.teal{background:#9be8dc}
.btn.coral{background:#ffb0a3}
.btn.lil{background:#ddd0ff}
.btn span.r{font-size:13px;opacity:.75}
.mrow{display:flex;gap:8px;align-items:stretch}
.mrow .who{flex:1;min-width:0;background:#f3ead6;box-shadow:var(--px);padding:7px 10px;font-size:13px;line-height:1.2}
.mrow .who b{display:block;font-size:15px;overflow-wrap:anywhere}
.mrow .btn{padding:8px 10px;font-size:14px;min-height:0}
.stick{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 4px 6px}
.stick div{padding:10px 9px;font-size:16px;line-height:1.25;white-space:pre-line;box-shadow:0 4px 0 rgba(43,42,76,.18);transform:rotate(-1.5deg)}
.stick div:nth-child(2n){transform:rotate(1.8deg)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:#f3ead6;box-shadow:var(--px);padding:10px 12px;font-size:15px}
.facts dt{color:var(--ink2);text-transform:uppercase;font-size:12px;letter-spacing:1px;padding-top:2px}
.facts dd{margin:0;font-weight:600}

/* sheets: journal */
.sheet{position:absolute;inset:0;z-index:9;background:rgba(43,42,76,.35);display:flex;align-items:flex-end;justify-content:center;padding:calc(var(--sat) + 50px) 12px calc(var(--sab) + 12px)}
.sheet .in{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--paper);box-shadow:var(--px),0 8px 0 0 rgba(43,42,76,.3);padding:16px;touch-action:pan-y;animation:dlgIn .25s cubic-bezier(.2,1.3,.5,1)}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheet h2{margin:0;font-size:24px}
.sheet .meta{font-size:14px;color:var(--ink2);margin-bottom:12px}
#jlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#jlist li{display:flex;align-items:center;gap:12px;padding:7px 9px;background:#f3ead6}
#jlist li.on{background:#fff0c2;cursor:pointer}
#jlist canvas{width:40px;height:40px;image-rendering:pixelated;flex:none}
#jlist li:not(.on) canvas{filter:brightness(0) opacity(.2)}
#jlist .t{flex:1;font-size:16px;font-weight:600;line-height:1.15}
#jlist .t small{display:block;font-weight:400;font-size:13px;color:var(--ink2)}
#jlist .go{font-size:13px;color:var(--ink2)}
.jgames{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jgames .btn{flex-direction:column;align-items:flex-start;gap:2px}
.jgames .btn small{font-size:12px;opacity:.8}
.jfoot{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.linkish{border:0;background:none;padding:8px;font-size:14px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}

/* plain page */
#page{position:absolute;inset:0;z-index:20;background:#fff8ea;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;font-family:Nunito,system-ui,sans-serif;user-select:text;-webkit-user-select:text}
#page .bar{position:sticky;top:0;z-index:2;background:rgba(255,248,234,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) 10px calc(var(--sal) + 16px);border-bottom:3px solid var(--ink);font-family:'Pixelify Sans'}
#page .bar b{font-size:16px}
#page main{max-width:560px;margin:0 auto;padding:22px calc(var(--sar) + 20px) calc(var(--sab) + 50px) calc(var(--sal) + 20px)}
#page h1{font-family:'Pixelify Sans';font-size:34px;margin:6px 0 4px;line-height:1.05}
#page .role{color:var(--ink2);font-weight:700;margin-bottom:22px}
#page section{margin:0 0 26px;padding-top:4px}
#page h2{font-family:'Pixelify Sans';font-size:22px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
#page h2 i{width:12px;height:12px;display:inline-block;box-shadow:0 0 0 2px var(--ink)}
#page p,#page li{font-size:16.5px;line-height:1.55;margin:0 0 8px}
#page ul{padding-left:20px;margin:0}
#page .line{font-weight:800;margin-bottom:4px}
#page .muted{color:var(--ink2)}
#page a{color:var(--ink);text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
#page .pf{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:#f3ead6;padding:10px 14px;margin:8px 0 10px;font-size:15px}
#page .pf dt{color:var(--ink2);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:1px;padding-top:2px}
#page .pf dd{margin:0;font-weight:700}
#page .notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#page .notes div{padding:10px;font-family:'Pixelify Sans';font-size:16px;white-space:pre-line;line-height:1.25}
#page .mail{display:flex;flex-direction:column;gap:8px}
#page .mail div{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f3ead6;padding:9px 12px}
#page .mail small{display:block;color:var(--ink2);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px}
#page .mail button{border:0;background:var(--sun);font-family:'Pixelify Sans';font-weight:600;padding:7px 10px;box-shadow:0 0 0 2px var(--ink);flex:none}
#page .back2{margin-top:10px;font-family:'Pixelify Sans'}

/* title */
#title{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;cursor:pointer;
  background:linear-gradient(#8fd8ff 0%,#b9ebff 34%,rgba(201,240,255,.0) 64%);transition:opacity .5s,transform .5s}
#title.gone{opacity:0;pointer-events:none;transform:translateY(-30px)}
#title .clouds{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#title .cl{position:absolute;image-rendering:pixelated;background-size:100% 100%;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
#title .logo{position:relative;margin-top:calc(var(--sat) + 13vh);text-align:center}
#title h1{margin:0;font-size:62px;line-height:.86;font-weight:700;color:var(--coral);letter-spacing:1px;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 9px 0 var(--ink),3px 9px 0 var(--ink),-3px 9px 0 var(--ink),3px 6px 0 var(--ink),-3px 6px 0 var(--ink)}
#title h1 span{display:block;color:var(--sun)}
#title .tag{margin-top:22px;font-size:17px;line-height:1.35;color:var(--ink);background:rgba(255,250,240,.85);padding:6px 12px;box-shadow:var(--px);display:inline-block}
#title .go{position:absolute;bottom:calc(var(--sab) + 92px);font-size:22px;font-weight:700;padding:12px 22px;background:var(--sun);box-shadow:var(--px),0 6px 0 0 rgba(43,42,76,.3);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
#title .skip{position:absolute;bottom:calc(var(--sab) + 30px);font-size:16px;background:rgba(255,250,240,.9);border:0;padding:9px 14px;box-shadow:var(--px)}

/* minigame */
#mg{position:absolute;inset:0;z-index:15;background:#2b2a4c;display:flex;flex-direction:column}
#mg .bar{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 12px) calc(var(--sar) + 14px) 12px calc(var(--sal) + 14px);background:var(--paper);box-shadow:0 3px 0 var(--ink);position:relative;z-index:2}
#mg .bar .t{flex:1;font-size:18px;font-weight:700;letter-spacing:1px}
#mg .bar .s{text-align:right;line-height:1}
#mg .bar .s b{font-size:24px;display:block}
#mg .bar .s small{font-size:12px;color:var(--ink2);letter-spacing:1px}
#mgc{flex:1;width:100%;min-height:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#mgOver{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);z-index:3;background:var(--paper);box-shadow:var(--px),0 8px 0 0 rgba(0,0,0,.3);padding:20px;text-align:center;animation:dlgIn .25s}
#mgOver h3{margin:0 0 6px;font-size:28px}
#mgOver p{margin:0 0 16px;font-size:17px;line-height:1.35}
#mgOver .nb{display:inline-block;background:var(--coral);color:#fff;padding:2px 8px;font-size:13px;letter-spacing:1px;margin-bottom:10px}
#mgOver .r{display:flex;flex-direction:column;gap:10px}
#mgOver .btn{justify-content:center}
</style>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="Kaiav's place, a small explorable pixel house"></canvas>

  <div id="hud">
    <button class="chip" id="found" aria-label="Journal: things found"><img id="starI" alt="" width="22" height="20"><b id="fcount">0/9</b><span id="pips"></span></button>
    <span class="sp"></span>
    <button class="chip" id="btnSnd" aria-label="Toggle sound"><img id="sndI" alt="" width="18" height="16"></button>
    <button class="chip" id="btnRead">Just read</button>
  </div>
  <div id="banner"></div>
  <div id="toast"></div>
  <div id="hint"></div>

  <div id="ctrl">
    <div id="base"><div id="knob"></div></div>
    <button id="abtn" aria-label="Interact"><b>A</b><small id="alab">&nbsp;</small></button>
  </div>

  <div id="dlg" hidden role="dialog" aria-live="polite">
    <div class="tag" id="dTag">SIGN</div>
    <button class="x chip" id="dX" aria-label="Close">✕</button>
    <div class="scr" id="dScr">
    <div class="row1">
      <canvas class="por" id="dPor" width="20" height="20"></canvas>
      <div class="body">
        <h3 id="dTitle"></h3>
        <div class="sub" id="dSub"></div>
        <div class="txt" id="dTxt"><span id="dTy"></span><span class="gh" id="dGh"></span></div>
        <div class="attr" id="dAttr"></div>
      </div>
    </div>
    <div class="ext" id="dExt"></div>
    <div class="ch" id="dCh"></div>
    </div>
    <div class="foot"><span class="pg" id="dPg"></span><span class="nx" id="dNx">tap ▼</span></div>
  </div>

  <div id="journal" class="sheet" hidden>
    <div class="in">
      <header><h2>Journal</h2><button class="chip" id="jX" aria-label="Close journal">✕</button></header>
      <div class="meta" id="jMeta"></div>
      <ul id="jlist"></ul>
      <div class="jgames">
        <button class="btn teal" id="jRally">Wall Rally<small id="jRB"></small></button>
        <button class="btn lil" id="jRoll">Dummy Roll<small id="jDB"></small></button>
      </div>
      <div class="jfoot">
        <button class="btn alt" id="jRead">Read everything as a page <span class="r">→</span></button>
        <button class="linkish" id="jReset">Start over (forget what I found)</button>
      </div>
    </div>
  </div>

  <div id="mg" hidden>
    <div class="bar">
      <button class="chip" id="mgX" aria-label="Quit game">✕</button>
      <div class="t" id="mgT">WALL RALLY</div>
      <div class="s"><b id="mgS">0</b><small>BEST <span id="mgB">0</span></small></div>
    </div>
    <canvas id="mgc"></canvas>
    <div id="mgOver" hidden>
      <div class="nb" id="mgNB" hidden>NEW BEST!</div>
      <h3 id="mgOT">Out!</h3>
      <p id="mgOP"></p>
      <div class="r"><button class="btn" id="mgAgain">Play again</button><button class="btn alt" id="mgBack">Back to the house</button></div>
    </div>
  </div>

  <div id="title">
    <div class="clouds" id="clouds"></div>
    <div class="logo">
      <h1>KAIAV'S<span>PLACE</span></h1>
      <div class="tag" id="ttag">walk around · poke at things<br>9 things to find · 2 games</div>
    </div>
    <div class="go">TAP TO START</div>
    <button class="skip" id="tSkip">Not a gamer? Just read it →</button>
  </div>

  <div id="page" hidden></div>
</div>

<script>
(() => {
'use strict';

/* ================= CONTENT (from src/content.js) ================= */
const CONTENT = {
  name: "Kaiav Nihalani",
  links: {
    linkedin: "https://www.linkedin.com/in/kaiav-nihalani-594703356/",
    x: "https://x.com/KaiavRNihalani",
    github: "https://github.com/knihalani/personal-site"
  },
  eden: { title: "Eden", role: "Founder", line: "Giving agents context",
    body: "Pivoting around but working in the agent context space, more to come soon ..." },

/* --- Dummy Roll (BJJ timing) --- */
const MOVES = ['GRIPS!', 'TAKEDOWN!', 'PASS!', 'MOUNT!', 'BACK TAKE!', 'TAP!'];
const BELTS = [[0, '#ffffff', 'WHITE'], [5, '#4a7fe0', 'BLUE'], [12, '#9a6fe0', 'PURPLE'], [20, '#8a5132', 'BROWN'], [30, '#2b2a4c', 'BLACK']];
const beltFor = s => { let b = BELTS[0]; for (const x of BELTS) if (s >= x[0]) b = x; return b; };
function newRoll() { return { st: 'ready', score: 0, hearts: 3, cur: 0.1, dir: 1, sp: 0.62, zc: 0.5, zw: 0.26, pose: 0, hold: 0, t: 0, pops: [], shake: 0, hop: 0, res: 0, parts: [] }; }
function rollZone(G) { const m = G.zw / 2 + 0.04; let c; do { c = m + Math.random() * (1 - 2 * m); } while (Math.abs(c - G.cur) < 0.18); G.zc = c; }
function rollTap() {

  const W = MG.W;
  if (d <= G.zw / 2) {
    const perfect = d <= 0.028, pts = perfect ? 2 : 1, before = beltFor(G.score);
    G.score += pts; G.pose = (G.pose + 1) % MOVES.length; G.hop = 0.3; G.res = 1;
    pop(G, MOVES[G.pose === 0 ? MOVES.length - 1 : G.pose - 1], W / 2, MG.H * 0.18, C.sun, 2);
    if (perfect) pop(G, 'PERFECT +2', W / 2, MG.H * 0.18 + 16, C.tealL, 1);
    G.sp = Math.min(G.sp + 0.07, 2.1); G.zw = Math.max(0.075, G.zw - 0.013);
    perfect ? sfx.great() : sfx.good(); sfx.thud(); haptic(12); G.shake = 0.1;
    for (let i = 0; i < 10; i++) G.parts.push({ x: W / 2, y: MG.H * 0.36, vx: (Math.random() - 0.5) * 90, vy: -Math.random() * 70, t: 0, c: [C.sun, C.white, C.coral][i % 3] });
    const after = beltFor(G.score); if (after !== before) { pop(G, after[2] + ' BELT!', W / 2, MG.H * 0.5, C.white, 2); sfx.fanfare(); }
  } else {

  }
  G.hold = 0.38; mgHud();
}
function rollUpdate(G, dt) {
  G.t += dt; G.shake = Math.max(0, G.shake - dt); G.hop = Math.max(0, G.hop - dt);
  if (G.st === 'play' || G.st === 'ready') {

    else { G.cur += G.dir * G.sp * dt * (G.st === 'ready' ? 0.6 : 1); if (G.cur > 1) { G.cur = 2 - G.cur; G.dir = -1; } if (G.cur < 0) { G.cur = -G.cur; G.dir = 1; } }
  }
  for (let i = G.parts.length - 1; i >= 0; i--) { const p = G.parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; if (p.t > 0.6) G.parts.splice(i, 1); }

function mgFrame(dt) {
