<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#fff4e6; --ink2:rgba(255,244,230,.72); --glass:rgba(16,13,42,.46); --line:rgba(255,236,214,.16);
  --amber:#ffc98a; --paper:#fbf3e7; --paper-ink:#211b3b; --paper-muted:#6f6680; --rule:#e6dccd;
  --disp:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0c2c;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;font-family:var(--body);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.fx{position:fixed;inset:0;pointer-events:none}
.grain{opacity:.075;background-size:128px 128px}
.vig{background:radial-gradient(120% 90% at 50% 45%,transparent 58%,rgba(6,4,22,.42) 100%)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 13px 0 7px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);font:500 12px/1 var(--body);letter-spacing:.02em;white-space:nowrap}
.pill b{font-weight:600}
.pill .nm{color:var(--ink2);font-weight:400}
#ring{width:24px;height:24px;flex:none}
#allBtn{cursor:pointer;padding:0 12px;gap:7px}
#allBtn svg{flex:none}
#allBtn:focus-visible,#dive:focus-visible,.sheet button:focus-visible,.sheet a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none}
#dive{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:9px;height:46px;padding:0 20px 0 16px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,214,170,.32);font:600 14px/1 var(--body);letter-spacing:.01em;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.6);transition:background .25s,color .25s,transform .15s}
#dive:active{transform:scale(.96)}
#dive[aria-pressed="true"]{background:rgba(255,236,210,.94);color:#211b3b;border-color:transparent}
#dive .ic-pause{display:none}#dive[aria-pressed="true"] .ic-pause{display:block}#dive[aria-pressed="true"] .ic-dive{display:none}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;border-radius:999px;
  background:rgba(14,11,38,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);font:500 13px/1.2 var(--body);white-space:nowrap;pointer-events:none;transition:opacity .6s,transform .6s}
#hint.gone{opacity:0;transform:translateX(-50%) translateY(8px)}
#hint small{display:block;color:var(--ink2);font-weight:400;font-size:11.5px;margin-top:2px}
.hand{position:relative;width:34px;height:34px;flex:none}
.hand i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:rgba(255,240,222,.95);box-shadow:0 0 0 4px rgba(255,240,222,.18);animation:pa 1.9s cubic-bezier(.5,0,.3,1) infinite}
.hand i+i{animation-name:pb}
@keyframes pa{0%,15%{transform:translate(-2px,2px)}55%,70%{transform:translate(-11px,11px)}100%{transform:translate(-2px,2px)}}
@keyframes pb{0%,15%{transform:translate(2px,-2px)}55%,70%{transform:translate(11px,-11px)}100%{transform:translate(2px,-2px)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translate(-50%,-8px);opacity:0;padding:9px 14px;border-radius:12px;background:rgba(251,243,231,.96);color:#211b3b;
  font:500 13px/1.3 var(--body);pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#veil{position:fixed;inset:0;background:#0e0c2c;transition:opacity .9s;pointer-events:none}
#veil.off{opacity:0}
/* everything sheet */
.wrap{position:fixed;inset:0;z-index:10;visibility:hidden}
.wrap.open{visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(8,6,24,.5);opacity:0;transition:opacity .3s}
.wrap.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 28px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;

.wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:#d8cdbd;margin:4px auto 10px}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:6px}
.sheet h2{font:400 34px/1.02 var(--disp);letter-spacing:-.01em;margin:0}
.sheet h2 em{font-style:italic;font-weight:300}
.sheet .role{margin:8px 0 0;color:var(--paper-muted);font-size:14px}
.sheet .x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:#fff;cursor:pointer;display:grid;place-items:center}
.sheet section{border-top:1px solid var(--rule);margin-top:20px;padding-top:16px}
.sheet h3{font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:#a0583f;margin:0 0 10px}
.sheet h4{font:400 24px/1.1 var(--disp);margin:0 0 4px}
.sheet .line{font:italic 400 17px/1.35 var(--disp);margin:0 0 10px;color:#3a3158}
.sheet p{font-size:15px;line-height:1.55;margin:0 0 10px}
.sheet ul{margin:0;padding:0;list-style:none}
.sheet li{position:relative;padding-left:18px;font-size:15px;line-height:1.5;margin:0 0 7px}
.sheet li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:1px;transform:rotate(45deg);background:#e0896a}
.sheet dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:12px 0}
.sheet dt{font:600 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--paper-muted);margin-bottom:4px}
.sheet dd{margin:0;font-size:15px}
.sheet a{color:#7a3f9a;text-decoration-thickness:1px;text-underline-offset:3px}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notes p{margin:0;padding:12px 12px 14px;border-radius:4px;font:500 21px/1.1 "Caveat",cursive;white-space:pre-line;background:#ffe9b8;box-shadow:0 6px 14px -10px rgba(40,20,40,.5)}
.notes p:nth-child(2){background:#ffd4c2}.notes p:nth-child(3){background:#cdeedc}.notes p:nth-child(4){background:#e4d8fb}
.mail{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule)}
.mail:last-child{border-bottom:0}
.mail .lab{width:100%;font:600 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--paper-muted)}
.mail a.addr{font-size:16px;font-weight:500;color:var(--paper-ink);margin-right:auto;word-break:break-all}
.chip{border:1px solid var(--rule);background:#fff;border-radius:999px;height:34px;padding:0 13px;font:500 13px/1 var(--body);cursor:pointer;color:var(--paper-ink);display:inline-flex;align-items:center;text-decoration:none}
.links{display:flex;gap:8px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.hand i{animation:none}.sheet,.scrim,#hint,#toast,#veil{transition:none}}
</style>

<body>
<canvas id="c" tabindex="0" role="img" aria-label="An endless zoom through Kaiav Nihalani's world. Each layer expands one part of him. Use the Everything button for all of it as text."></canvas>

<div class="fx vig"></div>

    <span><b id="depthNum">depth 0</b> <span class="nm" id="depthName">about</span></span>
  </div>

    <svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 3.5h11M2 7.5h11M2 11.5h7"/></svg>
    Everything
  </button>
</div>

<div id="hint" aria-hidden="true"><div class="hand"><i></i><i></i></div><div><span id="hintMain">Pinch to dive in</span><small id="hintSub">it never ends · or tap Dive</small></div></div>

<div class="bottom">
  <button id="dive" type="button" aria-pressed="false" aria-label="Dive: glide inward automatically">
    <svg class="ic-dive" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1.5" y="1.5" width="15" height="15" rx="4"/><rect x="5.5" y="5" width="7" height="8" rx="2"/><circle cx="9" cy="9" r=".9" fill="currentColor" stroke="none"/></svg>
    <svg class="ic-pause" width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="4.5" y="3.5" width="3" height="11" rx="1"/><rect x="10.5" y="3.5" width="3" height="11" rx="1"/></svg>
    <span id="diveLabel">Dive</span>
  </button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div class="wrap" id="wrap">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shName" tabindex="-1"></div>
</div>
<div id="veil"></div>

const C = { cream: '#fff4e6', cream85: 'rgba(255,244,230,.88)', cream70: 'rgba(255,244,230,.72)', cream55: 'rgba(255,244,230,.55)', amber: '#ffc98a', coral: '#ff8f7a', ink: '#241c45', mint: '#8fe8c8', lilac: '#cdb8ff' };
